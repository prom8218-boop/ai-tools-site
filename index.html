<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="AIFreedom UltraX — World-class AI trading platform with real-time signals, analytics, and smart money concepts."/>
<title>AIFreedom UltraX — Trade With Machine Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ═══════════════════════════════════════
   ROOT & RESET
═══════════════════════════════════════ */
:root {
  --g:       #00ffa3;
  --g2:      #00cc80;
  --blue:    #4d9fff;
  --amber:   #ffaa00;
  --red:     #ff4466;
  --purple:  #a78bfa;
  --bg:      #020408;
  --bg1:     #050b12;
  --bg2:     #080f1a;
  --glass:   rgba(255,255,255,0.030);
  --glass2:  rgba(255,255,255,0.055);
  --border:  rgba(0,255,163,0.10);
  --border2: rgba(0,255,163,0.28);
  --text:    rgba(255,255,255,0.88);
  --muted:   rgba(255,255,255,0.38);
  --dim:     rgba(255,255,255,0.16);
  --oxan:   'Oxanium', sans-serif;
  --mono:   'JetBrains Mono', monospace;
  --syne:   'Syne', sans-serif;
  --transition: cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  overflow-x: hidden;
  cursor: none;
}
a { text-decoration: none; color: inherit; }
button { cursor: none; }
img { display: block; max-width: 100%; }

/* ── SKIP TO CONTENT (Accessibility) ── */
.skip-link {
  position: fixed;
  top: -100%;
  left: 20px;
  z-index: 9999;
  background: var(--g);
  color: #000;
  padding: 10px 20px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  transition: top 0.2s;
}
.skip-link:focus { top: 20px; outline: 3px solid #000; }

/* ── CUSTOM CURSOR ── */
#cursor-dot {
  position: fixed;
  width: 8px; height: 8px;
  background: var(--g);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%,-50%);
  transition: transform 0.08s, width 0.18s, height 0.18s, background 0.18s;
  box-shadow: 0 0 10px var(--g), 0 0 24px rgba(0,255,163,0.4);
}
#cursor-ring {
  position: fixed;
  width: 36px; height: 36px;
  border: 1px solid rgba(0,255,163,0.45);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%,-50%);
  transition: transform 0.18s var(--transition), width 0.22s, height 0.22s, border-color 0.22s, opacity 0.22s;
}
body.cursor-hover #cursor-dot { width: 14px; height: 14px; }
body.cursor-hover #cursor-ring { width: 56px; height: 56px; border-color: rgba(0,255,163,0.7); }

/* ── CANVAS BG ── */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
/* Grain overlay */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.022;
  pointer-events:none;
  z-index:1;
}
/* Scanlines */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
  pointer-events:none;
  z-index:1;
}

/* ═══════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(0,255,163,0.25); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,255,163,0.45); }

/* ═══════════════════════════════════════
   TICKER TAPE
═══════════════════════════════════════ */
.ticker-wrap {
  position: relative;
  z-index: 100;
  background: rgba(0,255,163,0.045);
  border-bottom: 1px solid var(--border);
  height: 34px;
  overflow: hidden;
  display: flex;
  align-items: center;
}
.ticker-track {
  display: flex;
  animation: ticker 35s linear infinite;
  white-space: nowrap;
}
.ticker-track:hover { animation-play-state: paused; }
.t-item {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  padding: 0 26px;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.t-item .sym { color: rgba(255,255,255,0.6); font-weight:500; }
.t-item .up  { color: var(--g); }
.t-item .dn  { color: var(--red); }
.t-sep { color: var(--dim); }
@keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

/* ═══════════════════════════════════════
   NAVBAR
═══════════════════════════════════════ */
nav {
  position: sticky;
  top: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  height: 68px;
  background: rgba(2,4,8,0.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: background 0.3s;
}
nav.scrolled {
  background: rgba(2,4,8,0.97);
  border-bottom-color: var(--border);
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
.nav-logo {
  font-family: var(--oxan);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.1em;
  color: var(--g);
  text-shadow: 0 0 24px rgba(0,255,163,0.45);
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-logo-tag {
  font-size: 9px;
  background: var(--g);
  color: #000;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 3px;
  letter-spacing: 0.1em;
  vertical-align: middle;
}
.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}
.nav-links a {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: color 0.2s;
  position: relative;
  padding-bottom: 4px;
}
.nav-links a::after {
  content:'';
  position:absolute;
  left:0; bottom:0;
  width:0; height:1px;
  background:var(--g);
  transition:width 0.25s var(--transition);
}
.nav-links a:hover { color: var(--g); }
.nav-links a:hover::after { width: 100%; }
.nav-right { display: flex; align-items: center; gap: 14px; }
.btn-nav-ghost {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid var(--dim);
  color: var(--muted);
  padding: 8px 18px;
  border-radius: 4px;
  transition: all 0.2s;
}
.btn-nav-ghost:hover { border-color: var(--g); color: var(--g); }
.btn-nav-primary {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: var(--g);
  border: none;
  color: #000;
  font-weight: 600;
  padding: 9px 20px;
  border-radius: 4px;
  transition: box-shadow 0.2s, transform 0.15s;
}
.btn-nav-primary:hover {
  box-shadow: 0 0 28px rgba(0,255,163,0.5);
  transform: translateY(-1px);
}
/* Hamburger */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  padding: 8px;
}
.hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--g);
  border-radius: 2px;
  transition: all 0.3s;
}
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
/* Mobile menu */
.mobile-menu {
  position: fixed;
  inset: 0;
  top: 103px;
  background: rgba(2,4,8,0.97);
  z-index: 190;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  transform: translateX(100%);
  transition: transform 0.35s var(--transition);
}
.mobile-menu.open { transform: translateX(0); }
.mobile-menu a {
  font-family: var(--oxan);
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
  transition: color 0.2s;
}
.mobile-menu a:hover { color: var(--g); }

/* ═══════════════════════════════════════
   HERO
═══════════════════════════════════════ */
.hero {
  position: relative;
  z-index: 5;
  min-height: calc(100vh - 103px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 48px;
  max-width: 1380px;
  margin: 0 auto;
  padding: 80px 48px;
}
.hero-left { position: relative; }
.hero-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--g);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  opacity:0;
  animation: fadeUp 0.7s 0.1s forwards;
}
.eyebrow-line { flex: 1; max-width: 36px; height: 1px; background: var(--g); opacity: 0.5; }
.hero h1 {
  font-family: var(--oxan);
  font-size: clamp(52px,5.5vw,90px);
  font-weight: 800;
  line-height: 0.92;
  letter-spacing: -0.01em;
  color: white;
  margin-bottom: 28px;
  opacity:0;
  animation: fadeUp 0.8s 0.2s forwards;
}
.hero h1 .line-g {
  color: transparent;
  -webkit-text-stroke: 2px var(--g);
  display: block;
  text-shadow: none;
}
.hero h1 .line-acc {
  color: var(--g);
  display: block;
  text-shadow: 0 0 60px rgba(0,255,163,0.35);
}
.hero-desc {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.85;
  max-width: 440px;
  margin-bottom: 36px;
  opacity:0;
  animation: fadeUp 0.8s 0.32s forwards;
}
.hero-actions {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 56px;
  opacity:0;
  animation: fadeUp 0.8s 0.44s forwards;
}
.btn-hero {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 15px 32px;
  border-radius: 5px;
  border: none;
  transition: all 0.22s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-hero.primary {
  background: var(--g);
  color: #000;
}
.btn-hero.primary:hover {
  box-shadow: 0 0 48px rgba(0,255,163,0.55), 0 8px 24px rgba(0,255,163,0.2);
  transform: translateY(-2px);
}
.btn-hero.ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--dim);
}
.btn-hero.ghost:hover { border-color: rgba(255,255,255,0.25); color: white; }
/* Hero mini-stats */
.hero-stats {
  display: flex;
  gap: 36px;
  padding-top: 36px;
  border-top: 1px solid rgba(255,255,255,0.06);
  opacity:0;
  animation: fadeUp 0.8s 0.56s forwards;
}
.hs { }
.hs-val {
  font-family: var(--oxan);
  font-size: 30px;
  font-weight: 700;
  color: white;
  letter-spacing: 0.04em;
}
.hs-val .g { color: var(--g); }
.hs-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

/* ── TERMINAL WIDGET ── */
.terminal-wrap {
  opacity:0;
  animation: fadeLeft 0.9s 0.38s forwards;
  position: relative;
}
.terminal-wrap::before {
  content:'';
  position:absolute;
  inset: -1px;
  border-radius:14px;
  background: linear-gradient(135deg, rgba(0,255,163,0.18), transparent 55%, rgba(77,159,255,0.08));
  z-index:-1;
}
.terminal {
  background: rgba(5,11,18,0.95);
  border: 1px solid rgba(0,255,163,0.14);
  border-radius: 13px;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0,255,163,0.06), 0 48px 80px rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
}
.term-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 13px 18px;
  background: rgba(255,255,255,0.025);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.tdot { width:11px;height:11px;border-radius:50%; }
.tdot-r{background:#ff5f57;}.tdot-y{background:#febc2e;}.tdot-g{background:#28c840;}
.term-title {
  margin-left: 8px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.06em;
}
.term-live {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--g);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.live-dot {
  width:6px;height:6px;border-radius:50%;
  background:var(--g);
  box-shadow:0 0 8px var(--g);
  animation: livepulse 1.2s ease-in-out infinite;
}
@keyframes livepulse {
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.45;transform:scale(0.7)}
}
.term-body { padding: 18px; }
/* Chart header */
.ch-header { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px; }
.ch-left {}
.ch-sym { font-family:var(--oxan);font-size:20px;font-weight:700;letter-spacing:0.06em; }
.ch-pair { font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.08em;margin-top:2px; }
.ch-right { text-align:right; }
.ch-price { font-family:var(--oxan);font-size:30px;font-weight:700; }
.ch-change {
  font-family:var(--mono);font-size:10px;
  color:var(--g);background:rgba(0,255,163,0.09);
  padding:3px 9px;border-radius:3px;
  margin-top:4px;display:inline-block;
}
/* Tabs */
.term-tabs {
  display:flex;gap:2px;margin-bottom:14px;
  background:rgba(255,255,255,0.03);
  border-radius:5px;padding:3px;
}
.term-tab {
  font-family:var(--mono);font-size:9px;
  letter-spacing:0.1em;text-transform:uppercase;
  padding:5px 12px;border-radius:3px;border:none;
  background:transparent;color:var(--muted);
  transition:all 0.2s;flex:1;
}
.term-tab.active {
  background:rgba(0,255,163,0.1);color:var(--g);
}
/* Chart SVG */
.chart-svg { width:100%;height:120px; overflow:visible; }
/* Order book */
.ob-head {
  display:grid;grid-template-columns:1fr 1fr 1fr;
  font-family:var(--mono);font-size:8.5px;
  color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;
  padding:12px 0 4px;border-top:1px solid rgba(255,255,255,0.04);margin-top:12px;
}
.ob-row {
  display:grid;grid-template-columns:1fr 1fr 1fr;
  font-family:var(--mono);font-size:10px;
  padding:4.5px 0;position:relative;overflow:hidden;border-radius:2px;
}
.ob-row::before {
  content:'';position:absolute;left:0;top:0;bottom:0;border-radius:2px;
}
.ob-row.ask::before{background:var(--red);opacity:0.11;}
.ob-row.bid::before{background:var(--g);opacity:0.09;}
.ob-row .p { font-weight:600;position:relative;z-index:1; }
.ob-row.ask .p{color:var(--red);}
.ob-row.bid .p{color:var(--g);}
.ob-row .s,.ob-row .t { color:var(--muted);position:relative;z-index:1;font-size:9.5px; }
.ob-mid {
  text-align:center;padding:5px 0;
  font-family:var(--oxan);font-size:16px;font-weight:700;color:white;
}
.ob-spread{
  text-align:center;font-family:var(--mono);font-size:9px;
  color:var(--muted);margin-bottom:3px;
}
/* Signal */
.signal-box {
  display:flex;align-items:center;gap:10px;
  background:rgba(0,255,163,0.06);
  border:1px solid rgba(0,255,163,0.15);
  border-radius:6px;padding:11px 14px;margin-top:14px;
}
.sdot {
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--g);box-shadow:0 0 10px var(--g);
  animation:livepulse 1.4s ease-in-out infinite;
}
.stext { font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5; }
.stext strong{color:var(--g);}

/* ═══════════════════════════════════════
   TRUST BAR
═══════════════════════════════════════ */
.trust-bar {
  position:relative;z-index:5;
  border-top:1px solid rgba(255,255,255,0.04);
  border-bottom:1px solid rgba(255,255,255,0.04);
  padding:28px 48px;
  display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
}
.trust-label {
  font-family:var(--mono);font-size:9px;
  letter-spacing:0.25em;text-transform:uppercase;color:var(--dim);
  margin-right:8px;
}
.trust-logos { display:flex;align-items:center;gap:40px;flex-wrap:wrap;justify-content:center; }
.trust-logo {
  font-family:var(--oxan);font-size:13px;font-weight:700;
  letter-spacing:0.12em;color:var(--dim);
  text-transform:uppercase;opacity:0.55;
  transition:opacity 0.2s,color 0.2s;
}
.trust-logo:hover{opacity:1;color:rgba(255,255,255,0.6);}

/* ═══════════════════════════════════════
   STATS BAND
═══════════════════════════════════════ */
.stats-band {
  position:relative;z-index:5;
  background:linear-gradient(90deg,rgba(0,255,163,0.03) 0%,rgba(77,159,255,0.03) 100%);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:56px 48px;
}
.stats-inner {
  max-width:1100px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:20px;text-align:center;
}
.stat-item { padding:10px; }
.stat-num {
  font-family:var(--oxan);font-size:52px;font-weight:800;
  letter-spacing:0.02em;color:var(--g);
  line-height:1;
}
.stat-unit { font-size:28px; }
.stat-label {
  font-family:var(--mono);font-size:9.5px;
  color:var(--muted);letter-spacing:0.2em;
  text-transform:uppercase;margin-top:8px;line-height:1.6;
}

/* ═══════════════════════════════════════
   SECTIONS — shared
═══════════════════════════════════════ */
.section {
  position:relative;z-index:5;
  max-width:1380px;margin:0 auto;
  padding:100px 48px;
}
.sec-eyebrow {
  font-family:var(--mono);font-size:10px;
  letter-spacing:0.3em;text-transform:uppercase;color:var(--g);
  margin-bottom:14px;display:flex;align-items:center;gap:10px;
}
.sec-eyebrow::before{content:'//';opacity:0.4;font-size:9px;}
.sec-title {
  font-family:var(--oxan);font-size:clamp(36px,4vw,58px);
  font-weight:800;letter-spacing:0.02em;color:white;margin-bottom:16px;
  line-height:1.05;
}
.sec-title em { color:var(--g);font-style:normal; }
.sec-sub {
  font-family:var(--mono);font-size:12px;
  color:var(--muted);max-width:520px;line-height:1.9;margin-bottom:60px;
}
/* Reveal on scroll */
.reveal {
  opacity:0;transform:translateY(24px);
  transition:opacity 0.7s var(--transition),transform 0.7s var(--transition);
}
.reveal.visible { opacity:1;transform:translateY(0); }

/* ═══════════════════════════════════════
   FEATURES
═══════════════════════════════════════ */
.feat-grid {
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;
}
.feat-card {
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:12px;padding:30px;
  position:relative;overflow:hidden;
  transition:border-color 0.28s,box-shadow 0.28s,transform 0.28s;
}
.feat-card:hover {
  border-color:var(--border2);
  box-shadow:0 0 50px rgba(0,255,163,0.06),0 24px 48px rgba(0,0,0,0.5);
  transform:translateY(-4px);
}
.feat-card::before {
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,163,0.35),transparent);
  opacity:0;transition:opacity 0.3s;
}
.feat-card:hover::before { opacity:1; }
.feat-card::after {
  content:'';position:absolute;
  bottom:-60px;right:-60px;
  width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,255,163,0.05),transparent 70%);
  opacity:0;transition:opacity 0.3s;
}
.feat-card:hover::after { opacity:1; }
.feat-icon {
  width:48px;height:48px;border-radius:10px;
  background:rgba(0,255,163,0.07);
  border:1px solid rgba(0,255,163,0.14);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:20px;
}
.feat-tag {
  position:absolute;top:22px;right:22px;
  font-family:var(--mono);font-size:8px;
  letter-spacing:0.14em;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;
  color:var(--g);background:rgba(0,255,163,0.08);
  border:1px solid rgba(0,255,163,0.15);
}
.feat-name {
  font-family:var(--syne);font-size:15px;font-weight:700;
  color:white;margin-bottom:10px;letter-spacing:0.01em;
}
.feat-desc {
  font-family:var(--mono);font-size:11px;
  color:var(--muted);line-height:1.8;
}
.feat-spark { margin-top:22px;height:40px;width:100%; }
.feat-arrow {
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:10px;
  color:var(--g);letter-spacing:0.1em;text-transform:uppercase;
  margin-top:16px;opacity:0;transition:opacity 0.2s;
}
.feat-card:hover .feat-arrow { opacity:1; }

/* ═══════════════════════════════════════
   HOW IT WORKS
═══════════════════════════════════════ */
.how-grid {
  display:grid;grid-template-columns:repeat(3,1fr);gap:0;
  position:relative;margin-top:20px;
}
.how-grid::before {
  content:'';position:absolute;
  top:44px;left:calc(16.67% + 24px);right:calc(16.67% + 24px);
  height:1px;background:linear-gradient(90deg,var(--border),var(--border2),var(--border));
  z-index:1;
}
.how-step { padding:0 32px 0 0;position:relative;z-index:2; }
.how-step:last-child { padding-right:0; }
.how-num {
  width:52px;height:52px;border-radius:50%;
  border:1px solid var(--border2);
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--oxan);font-size:18px;font-weight:800;
  color:var(--g);margin-bottom:24px;
  box-shadow:0 0 24px rgba(0,255,163,0.12);
}
.how-title {
  font-family:var(--syne);font-size:17px;font-weight:700;
  color:white;margin-bottom:10px;
}
.how-desc {
  font-family:var(--mono);font-size:11px;
  color:var(--muted);line-height:1.85;
}

/* ═══════════════════════════════════════
   SIGNAL SHOWCASE
═══════════════════════════════════════ */
.showcase-band {
  position:relative;z-index:5;
  background:var(--bg1);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  overflow:hidden;
}
.showcase-inner {
  max-width:1380px;margin:0 auto;
  display:grid;grid-template-columns:1fr 1fr;
  align-items:center;gap:64px;
  padding:100px 48px;
}
.sc-terminal {
  background:rgba(2,4,8,0.9);border:1px solid var(--border);
  border-radius:12px;padding:28px;
  box-shadow:0 0 60px rgba(0,255,163,0.05),0 32px 64px rgba(0,0,0,0.6);
}
.sc-header {
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;padding-bottom:16px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.sc-title-mono {
  font-family:var(--mono);font-size:10px;
  color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;
}
.signal-row {
  display:grid;grid-template-columns:auto 1fr auto auto;
  align-items:center;gap:16px;
  padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04);
}
.signal-row:last-child { border-bottom:none; }
.sr-type {
  font-family:var(--mono);font-size:8px;
  letter-spacing:0.15em;text-transform:uppercase;
  padding:3px 9px;border-radius:3px;font-weight:600;
}
.sr-type.long  { color:#000;background:var(--g); }
.sr-type.short { color:#fff;background:var(--red); }
.sr-type.hold  { color:#000;background:var(--amber); }
.sr-pair { font-family:var(--oxan);font-size:14px;font-weight:700;color:white; }
.sr-sub  { font-family:var(--mono);font-size:9px;color:var(--muted); }
.sr-ret  { font-family:var(--oxan);font-size:18px;font-weight:700; }
.sr-ret.pos{color:var(--g);}.sr-ret.neg{color:var(--red);}
.sr-conf { text-align:right; }
.sr-conf-val {
  font-family:var(--mono);font-size:11px;color:white;
  display:flex;align-items:center;gap:4px;justify-content:flex-end;
}
.conf-bar {
  width:40px;height:3px;border-radius:2px;
  background:rgba(255,255,255,0.08);overflow:hidden;
}
.conf-fill { height:100%;border-radius:2px;background:var(--g); }
.sr-time { font-family:var(--mono);font-size:8.5px;color:var(--muted); }
.sc-footer {
  margin-top:16px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,0.05);
  display:flex;justify-content:space-between;align-items:center;
}
.sc-foot-stat { font-family:var(--mono);font-size:9.5px;color:var(--muted); }
.sc-foot-stat strong { color:var(--g); }

/* ═══════════════════════════════════════

═══════════════════════════════════════ */

}
.ptog-label.active { color:white; }
.toggle-switch {

}
.toggle-switch.on { background:rgba(0,255,163,0.15);border-color:rgba(0,255,163,0.3); }

.toggle-switch.on .toggle-knob { transform:translateX(22px);background:var(--g); }
.save-pill {
  font-family:var(--mono);font-size:9px;
  letter-spacing:0.1em;text-transform:uppercase;
  color:#000;background:var(--amber);
  padding:2px 9px;border-radius:10px;font-weight:600;
}
.pricing-grid {
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
}
.price-card {
  background:var(--glass);border:1px solid var(--border);

.testi-avatar {

  color:#000;flex-shrink:0;
}
.testi-name {
  font-family:var(--syne);font-size:13px;font-weight:700;color:white;
}
.testi-role {
  font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:0.04em;
}

}
.testi-ret-val {

}

═══════════════════════════════════════ */

}

}
.faq-icon {

}
.faq-item.open .faq-icon { transform:rotate(45deg); }
.faq-a {
  font-family:var(--mono);font-size:11.5px;color:var(--muted);

  transition:max-height 0.4s var(--transition),padding 0.3s;
}
.faq-item.open .faq-a { max-height:300px;padding-bottom:18px; }

═══════════════════════════════════════ */

  position:relative;z-index:5;overflow:hidden;
  background:linear-gradient(135deg,rgba(0,255,163,0.08) 0%,rgba(77,159,255,0.04) 50%,rgba(0,255,163,0.06) 100%);

<body>
<canvas id="bg-canvas"></canvas>
<div id="cursor-dot"  aria-hidden="true"></div>
<div id="cursor-ring" aria-hidden="true"></div>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div id="root"></div>

<!-- Background canvas script -->
<script>
(function(){
  const canvas=document.getElementById('bg-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,t=0;
  const orbs=[
    {x:0.15,y:0.25,r:0.28,c:'0,255,163'},
    {x:0.85,y:0.15,r:0.22,c:'77,159,255'},
    {x:0.5, y:0.8, r:0.32,c:'0,255,163'},
    {x:0.9, y:0.7, r:0.18,c:'77,159,255'},
  ];
  const particles=[];
  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
  }
  resize();
  window.addEventListener('resize',resize);
  for(let i=0;i<60;i++) particles.push({
    x:Math.random(),y:Math.random(),
    vx:(Math.random()-.5)*.0003,vy:(Math.random()-.5)*.0003,
    r:Math.random()*1.1+.3,o:Math.random()*.3+.08
  });
  function draw(){
    t+=0.004;
    ctx.clearRect(0,0,W,H);
    /* orbs */
    orbs.forEach((o,i)=>{
      const ox=o.x*W+Math.sin(t*0.6+i*1.2)*W*0.04;
      const oy=o.y*H+Math.cos(t*0.5+i*0.9)*H*0.04;
      const gr=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r*Math.min(W,H));
      gr.addColorStop(0,`rgba(${o.c},0.055)`);
      gr.addColorStop(1,'transparent');
      ctx.beginPath();
      ctx.arc(ox,oy,o.r*Math.min(W,H),0,Math.PI*2);
      ctx.fillStyle=gr;ctx.fill();
    });
    /* grid */
    ctx.strokeStyle='rgba(0,255,163,0.035)';ctx.lineWidth=1;
    const step=64;
    for(let x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    /* particles */
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;
      ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,255,163,${p.o})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
/* Custom cursor */
(function(){

/* ── SPARKLINE ── */
function Sparkline({data,color='#00ffa3'}){
  const w=200,h=40;
  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const pts=data.map((v,i)=>({x:(i/(data.length-1))*w,y:h-((v-min)/range)*h*0.9-h*0.05}));
  const d=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area=`${d} L${w},${h} L0,${h} Z`;
  const id=`sg${color.replace(/[^a-z0-9]/gi,'')}${Math.random().toString(36).slice(2,5)}`;
  return(
    <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%',height:'100%'}} preserveAspectRatio="none">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${id})`}/>
      <path d={d} fill="none" stroke={color} strokeWidth="1.6"
        style={{strokeDasharray:500,strokeDashoffset:500,animation:'drawLine 1.6s ease forwards'}}/>
    </svg>
  );
}

/* ── COUNTER ── */
function Counter({end,duration=1800,prefix='',suffix=''}){
  const [val,setVal]=useState(0);
  const ref=useRef(null);
  useEffect(()=>{
    const ob=new IntersectionObserver(en=>{
      if(!en[0].isIntersecting)return;
      ob.disconnect();
      const s=Date.now();
      const tick=()=>{
        const p=Math.min((Date.now()-s)/duration,1);
        const e=1-Math.pow(1-p,3);
        setVal(Math.floor(e*end));
        if(p<1)requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    },{threshold:0.4});
    if(ref.current)ob.observe(ref.current);
    return()=>ob.disconnect();
  },[end,duration]);
  return<span ref={ref}>{prefix}{val.toLocaleString()}{suffix}</span>;
}

/* ── REVEAL HOOK ── */
function useReveal(){
  useEffect(()=>{
    const els=document.querySelectorAll('.reveal');
    const ob=new IntersectionObserver(en=>{
      en.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
    },{threshold:0.12});
    els.forEach(el=>ob.observe(el));
    return()=>ob.disconnect();
  },[]);
}

                  <div className="ch-right">
                    <div className="ch-price">49,412</div>
                    <div className="ch-change">▲ +3.24% · 24H</div>
                  </div>
                </div>
                {/* Tabs */}
                <div className="term-tabs" role="tablist" aria-label="Terminal views">
                  {['chart','book','depth'].map(tab=>(
                    <button key={tab} className={`term-tab${activeTab===tab?' active':''}`}
                      onClick={()=>setActiveTab(tab)}
                      role="tab" aria-selected={activeTab===tab}
                      aria-label={tab.charAt(0).toUpperCase()+tab.slice(1)}>
                      {tab}
                    </button>
                  ))}
                </div>
                {/* Chart tab */}
                {activeTab==='chart'&&<HeroChart/>}
                {/* Book tab */}
                {activeTab==='book'&&(
                  <div>
                    <div className="ob-head"><span>Price(USDT)</span><span>Size(BTC)</span><span>Total</span></div>
                    {[{p:'49,462',s:'0.884',t:'2.65'},{p:'49,441',s:'1.234',t:'1.77'},{p:'49,428',s:'0.534',t:'0.53'}].map((r,i)=>(
                      <div className="ob-row ask" key={i}><span className="p">{r.p}</span><span className="s">{r.s}</span><span className="t">{r.t}</span></div>
                    ))}
                    <div className="ob-spread">Spread: $16.00 · 0.033%</div>
                    <div className="ob-mid">49,412.50</div>
                    {[{p:'49,396',s:'0.610',t:'0.61'},{p:'49,375',s:'0.991',t:'1.60'},{p:'49,351',s:'1.440',t:'3.04'}].map((r,i)=>(
                      <div className="ob-row bid" key={i}><span className="p">{r.p}</span><span className="s">{r.s}</span><span className="t">{r.t}</span></div>
                    ))}
                  </div>
                )}
                {/* Depth tab */}
                {activeTab==='depth'&&(
                  <div style={{padding:'8px 0'}}>
                    {[
                      {label:'Bid Vol (24H)',val:'$1.84B',color:'#00ffa3',pct:72},
                      {label:'Ask Vol (24H)',val:'$0.71B',color:'#ff4466',pct:28},
                      {label:'OI Change',val:'+12.4%',color:'#4d9fff',pct:60},
                      {label:'Funding Rate',val:'0.012%',color:'#ffaa00',pct:45},
                    ].map((d,i)=>(
                      <div key={i} style={{marginBottom:12}}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:5,fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',letterSpacing:'0.08em'}}>
                          <span>{d.label}</span><span style={{color:'white'}}>{d.val}</span>
                        </div>
                        <div style={{height:4,background:'rgba(255,255,255,0.06)',borderRadius:2,overflow:'hidden'}}>
                          <div style={{height:'100%',width:`${d.pct}%`,background:d.color,borderRadius:2,
                            transition:'width 1s ease',boxShadow:`0 0 8px ${d.color}55`}}/>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                {/* Signal */}
                <div className="signal-box" role="status" aria-live="polite" aria-label="Active AI signal">
                  <div className="sdot"/>
                  <div className="stext">
                    <strong>AI SIGNAL ACTIVE —</strong> LONG BTC @ 49,200 · TP₁ 51,500 · TP₂ 54,000 · SL 47,800 · Conf <strong>94%</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      {/* ── TRUST BAR ── */}
      <div className="trust-bar" aria-label="Trusted partners">
        <span className="trust-label">Trusted & integrated with</span>
        <div className="trust-logos">
          {['Binance','Coinbase','Interactive Brokers','MetaTrader 5','TradingView','Bybit','Kraken'].map(b=>(
            <span key={b} className="trust-logo">{b}</span>
          ))}
        </div>
      </div>

      {/* ── STATS BAND ── */}
      <div className="stats-band" aria-label="Platform statistics">
        <div className="stats-inner">
          {[
            {end:52400,suf:'',label:'Active Traders'},
            {end:94,suf:'%',label:'Signal Accuracy Rate'},
            {end:1200,suf:'M+',label:'Trades Analyzed'},
            {end:99,suf:'%',label:'Platform Uptime'},
          ].map((s,i)=>(
            <div className="stat-item reveal" key={i} style={{transitionDelay:`${i*0.1}s`}}>
              <div className="stat-num" aria-label={`${s.end}${s.suf} ${s.label}`}>
                <Counter end={s.end}/><span className="stat-unit">{s.suf}</span>
              </div>
              <div className="stat-label">{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── FEATURES ── */}
      <div className="section" id="platform-features">
        <div className="reveal">
          <div className="sec-eyebrow">Platform Modules</div>
          <div className="sec-title">Everything you need<br/>to <em>dominate the market</em></div>
          <div className="sec-sub">Six world-class AI modules, unified in one platform. Built for traders who refuse to leave money on the table.</div>
        </div>
        <div className="feat-grid">
          {FEATURES.map((f,i)=>(
            <div className="feat-card reveal" key={i} style={{transitionDelay:`${i*0.09}s`}}
              tabIndex={0} role="article" aria-label={f.name}>
              <div className="feat-icon" aria-hidden="true">{f.icon}</div>
              <div className="feat-tag">{f.tag}</div>
              <div className="feat-name">{f.name}</div>
              <div className="feat-desc">{f.desc}</div>
              <div className="feat-spark"><Sparkline data={f.spark} color={f.color}/></div>
              <div className="feat-arrow" aria-hidden="true">Learn more →</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── HOW IT WORKS ── */}
      <div className="section" style={{background:'none'}}>
        <div className="reveal">
          <div className="sec-eyebrow">Process</div>
          <div className="sec-title">Up and trading in <em>three steps</em></div>
          <div className="sec-sub">From signup to your first signal in under 5 minutes. No technical knowledge required.</div>
        </div>
        <div className="how-grid">
          {[
            {n:'01',title:'Create Your Account',desc:'Sign up in 60 seconds. Choose your plan, connect your broker or exchange via API (read-only), and set your risk profile. Your data is encrypted and we never touch your funds.'},
            {n:'02',title:'Configure Your AI',desc:'Select the markets and timeframes you trade. Set position size limits, preferred signal types, and notification preferences. The AI calibrates to your personal trading style.'},
            {n:'03',title:'Execute & Profit',desc:'Receive instant signals with entry, TP, SL, and confidence score. One-click execution via our terminal or auto-forward to your exchange. Track performance in real time.'},
          ].map((s,i)=>(
            <div className="how-step reveal" key={i} style={{transitionDelay:`${i*0.15}s`}}>
              <div className="how-num" aria-hidden="true">{s.n}</div>
              <div className="how-title">{s.title}</div>
              <div className="how-desc">{s.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── SIGNAL SHOWCASE ── */}
      <div className="showcase-band" id="signals">
        <div className="showcase-inner">
          <div className="reveal">
            <div className="sec-eyebrow">Live Signals</div>
            <div className="sec-title">The <em>AI's track record</em><br/>speaks for itself</div>
            <div className="sec-sub" style={{marginBottom:32}}>Every signal is logged, timestamped, and publicly verifiable. No cherry-picking. No survivorship bias. Raw performance.</div>
            <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
              {[{label:'Win Rate',val:'94.2%'},{label:'Avg R:R',val:'1:2.8'},{label:'Sharpe',val:'3.14'}].map(m=>(
                <div key={m.label}>
                  <div style={{fontFamily:'var(--oxan)',fontSize:28,fontWeight:700,color:'var(--g)'}}>{m.val}</div>
                  <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',letterSpacing:'0.15em',textTransform:'uppercase',marginTop:3}}>{m.label}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="sc-terminal reveal" style={{transitionDelay:'0.15s'}}>
            <div className="sc-header">
              <div className="sc-title-mono">Recent AI Signals</div>
              <div className="term-live"><div className="live-dot"/>Live</div>
            </div>
            {SIGNALS.map((s,i)=>(
              <div className="signal-row" key={i} role="row">
                <span className={`sr-type ${s.type}`}>{s.type}</span>
                <div>
                  <div className="sr-pair">{s.pair}</div>
                  <div className="sr-sub">{s.sub}</div>
                </div>
                <div className={`sr-ret ${s.pos?'pos':'neg'}`}>{s.ret}</div>
                <div className="sr-conf">
                  <div className="sr-conf-val">
                    {s.conf}%
                    <div className="conf-bar"><div className="conf-fill" style={{width:`${s.conf}%`}}/></div>
                  </div>
                  <div className="sr-time">{s.time}</div>
                </div>
              </div>
            ))}
            <div className="sc-footer">
              <span className="sc-foot-stat">Win rate <strong>94.2%</strong> · 18mo forward test</span>
              <span className="sc-foot-stat"><strong style={{color:'var(--muted)'}}>Past performance ≠ future results</strong></span>
            </div>
          </div>
        </div>
      </div>

      {/* ── PRICING ── */}
      <div className="section" id="pricing">
        <div className="reveal" style={{textAlign:'center',marginBottom:0}}>
          <div className="sec-eyebrow" style={{justifyContent:'center'}}>Pricing</div>
          <div className="sec-title" style={{maxWidth:600,margin:'0 auto 14px'}}>
            Transparent pricing,<br/><em>extraordinary returns</em>
          </div>
          <div className="sec-sub" style={{margin:'0 auto 0',textAlign:'center'}}>
            No hidden fees. Cancel anytime. 7-day money-back guarantee on all paid plans.
          </div>
        </div>
        {/* Toggle */}
        <div className="pricing-toggle">
          <span className={`ptog-label${!annual?' active':''}`}>Monthly</span>
          <div className={`toggle-switch${annual?' on':''}`} onClick={()=>setAnnual(a=>!a)}
            role="switch" aria-checked={annual} tabIndex={0}
            aria-label="Toggle annual billing"
            onKeyDown={e=>{if(e.key===' '||e.key==='Enter')setAnnual(a=>!a);}}>
            <div className="toggle-knob"/>
          </div>
          <span className={`ptog-label${annual?' active':''}`}>Annual</span>
          {annual&&<span className="save-pill">Save 20%</span>}
        </div>
        <div className="pricing-grid">
          {PLANS.map((plan,i)=>(
            <div key={i} className={`price-card reveal${plan.featured?' featured':''}`}
              style={{transitionDelay:`${i*0.12}s`}}
              role="article" aria-label={`${plan.name} plan`}>
              {plan.badge&&<div className="plan-badge">{plan.badge}</div>}
              <div className="plan-name">{plan.name}</div>
              <div className="plan-price">
                <span className="plan-currency">$</span>
                <span className="plan-amount">{annual?plan.price.yr:plan.price.mo}</span>
                <span className="plan-period">{plan.price.mo>0?'/mo':''}</span>
              </div>
              {annual&&plan.price.mo>0&&(
                <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--g)',marginBottom:2}}>
                  Billed ${(annual?plan.price.yr:plan.price.mo)*12}/year
                </div>
              )}
              <div className="plan-desc">{plan.desc}</div>
              <div className="plan-divider"/>
              <ul className="plan-features">
                {plan.features.map((f,j)=>(
                  <li key={j} className="plan-feat">{f}</li>
                ))}
              </ul>
              <button className={`btn-plan ${plan.btn.style}`}
                aria-label={`${plan.btn.label} - ${plan.name} plan`}>
                {plan.btn.label}
              </button>
            </div>
          ))}
        </div>
      </div>

      {/* ── TESTIMONIALS ── */}
      <div className="section" style={{paddingTop:0}}>
        <div className="reveal">
          <div className="sec-eyebrow">Testimonials</div>
          <div className="sec-title">Trusted by <em>real traders</em></div>
          <div className="sec-sub">From retail beginners to professional fund managers — here's what our community says.</div>
        </div>
        <div className="testi-grid">
          {TESTIMONIALS.map((t,i)=>(
            <div key={i} className="testi-card reveal" style={{transitionDelay:`${i*0.12}s`}}
              role="article" aria-label={`Testimonial from ${t.name}`}>
              <div className="testi-stars" aria-label="5 stars">
                {'★★★★★'.split('').map((s,j)=><span key={j} className="star" aria-hidden="true">{s}</span>)}
              </div>
              <p className="testi-text">{t.text}</p>
              <div className="testi-author">
                <div className="testi-avatar" style={{background:t.avatarBg}} aria-hidden="true">{t.avatar}</div>
                <div>
                  <div className="testi-name">{t.name}</div>
                  <div className="testi-role">{t.role}</div>
                </div>
                <div className="testi-ret">
                  <div className="testi-ret-val">{t.ret}</div>
                  <div className="testi-ret-label">{t.period}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* ── FAQ ── */}
      <div className="section" style={{paddingTop:0,maxWidth:860}} id="faq">
        <div className="reveal" style={{textAlign:'center'}}>
          <div className="sec-eyebrow" style={{justifyContent:'center'}}>FAQ</div>
          <div className="sec-title" style={{textAlign:'center',marginBottom:14}}>
            Common <em>questions</em>
          </div>
          <div className="sec-sub" style={{textAlign:'center',margin:'0 auto 48px'}}>
            Everything you need to know before you start.
          </div>
        </div>
        <div className="faq-list" role="list">
          {FAQS.map((f,i)=>(
            <div key={i} className={`faq-item reveal${openFaq===i?' open':''}`}
              style={{transitionDelay:`${i*0.07}s`}} role="listitem">
              <div className="faq-q" onClick={()=>setOpenFaq(openFaq===i?null:i)}
                role="button" tabIndex={0} aria-expanded={openFaq===i}
                aria-controls={`faq-a-${i}`}
                onKeyDown={e=>{if(e.key===' '||e.key==='Enter')setOpenFaq(openFaq===i?null:i);}}>
                <span className="faq-q-text">{f.q}</span>
                <span className="faq-icon" aria-hidden="true">+</span>
              </div>
              <div className="faq-a" id={`faq-a-${i}`} role="region" aria-label={f.q}>
                {f.a}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* ── CTA ── */}
      <div className="cta-band">
        <div className="cta-inner reveal">
          <div className="cta-eyebrow">Get Started Today</div>
          <div className="cta-title">
            YOUR EDGE<br/>STARTS <em>NOW</em>
          </div>
          <p className="cta-sub">
            Join 52,400+ traders who use AIFreedom UltraX to outperform the market.
            Start free — no credit card required.
          </p>
          <div className="cta-actions">
            <button className="btn-hero primary" aria-label="Launch platform for free">
              Launch Free Platform →
            </button>
            <button className="btn-hero ghost" aria-label="View all pricing plans">
              View Pricing
            </button>
          </div>
        </div>
      </div>

      {/* ── FOOTER ── */}
      <footer role="contentinfo">
        <div className="foot-top">
          <div className="foot-brand">
            <div className="foot-logo-text">AIFREEDOM ULTRAX</div>
            <p className="foot-tagline">
              The world's most advanced AI trading platform. Institutional-grade intelligence for every trader.
            </p>
            <div className="foot-badge">
              <div className="live-dot" style={{width:6,height:6}}/>
              All systems operational
            </div>
            {/* Newsletter */}
            <div style={{marginTop:20}}>
              <div style={{fontFamily:'var(--mono)',fontSize:9.5,color:'var(--muted)',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:8}}>
                Get market intelligence in your inbox
              </div>
              {newsSuccess?(
                <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--g)',padding:'8px 0'}}>
                  ✓ You're subscribed. Welcome to the edge.
                </div>
              ):(
                <form className="news-form" onSubmit={handleNews} role="form" aria-label="Newsletter signup">
                  <input className="news-input" type="email" placeholder="your@email.com"
                    value={newsEmail} onChange={e=>setNewsEmail(e.target.value)}
                    aria-label="Email address" required/>
                  <button className="news-btn" type="submit" aria-label="Subscribe to newsletter">
                    Subscribe
                  </button>
                </form>
              )}
            </div>
          </div>
          {[
            {title:'Platform',links:['Trading Terminal','AI Signals','Smart Money','Portfolio Analytics','Paper Trading','Mobile App']},
            {title:'Learn',links:['AI Academy','Signal Explained','Strategy Library','Webinars','Blog','Community']},
            {title:'Company',links:['About Us','Careers','Press','Partner Program','Status','Contact']},
          ].map(col=>(
            <div key={col.title}>
              <div className="foot-col-title">{col.title}</div>
              <ul className="foot-links" role="list">
                {col.links.map(l=>(
                  <li key={l}><a href="#" aria-label={l}>{l}</a></li>
                ))}
              </ul>
            </div>
          ))}
        </div>
        <div className="foot-bottom">
          <div className="foot-copy">
            © 2026 AIFreedom UltraX. All rights reserved. · Not financial advice. Trading involves substantial risk of loss.
          </div>
          <div className="foot-legal">
            {['Privacy Policy','Terms of Service','Risk Disclosure','Cookie Policy'].map(l=>(
              <a key={l} href="#" aria-label={l}>{l}</a>
            ))}
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
