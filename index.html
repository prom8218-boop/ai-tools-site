<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIFreedom UltraX</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body{
      margin:0;
      background:#05070a;
      color:white;
      font-family:Arial;
    }

    .hero{
      padding:80px 20px;
      text-align:center;
    }

    h1{
      font-size:60px;
      color:#00ff88;
    }

    .card{
      background:#111;
      margin:20px;
      padding:20px;
      border-radius:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:20px;
    }

    button{
      background:#00ff88;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function App(){

  const features = [
    "AI Trading Signals",
    "Trading Dashboard",
    "AI Academy",
    "VIP Membership",
    "AI Analytics",
    "Smart Money Concepts"
  ];

  return(
    <div>

      <section className="hero">

        <h1>AIFreedom UltraX</h1>

        <p>
          World-Class AI Trading Platform
        </p>

        <button>
          Launch Platform
        </button>

      </section>

      <div className="grid">

        {
          features.map((item,index)=>(

            <div className="card" key={index}>

              <h2>{item}</h2>

              <p>
                Professional AI module for trading automation.
              </p>

            </div>

          ))
        }

      </div>

    </div>
  )
}

const root = ReactDOM.createRoot(
  document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
