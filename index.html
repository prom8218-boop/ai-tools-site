<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFreedom Pro - Neural AI Trading Station</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #00ff88; --accent: #FF6B2B; --bg: #05070a; --card: #0c0e14; }
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        
        body { 
            background: var(--bg);
            background-image: radial-gradient(circle at 10% 10%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
                              url('https://images.unsplash.com/photo-1611974717482-98252c6a4932?auto=format&fit=crop&w=1600');
            background-size: cover; background-attachment: fixed;
            color: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(8, 10, 16, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 255, 136, 0.2); position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 1400px; margin: 0 auto; padding: 25px; }
        
        .ai-badge { background: linear-gradient(90deg, #00ff88, #00bdff); color: #000; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .btn-vip { background: var(--primary); color: #000; padding: 12px 25px; border-radius: 10px; font-weight: 800; text-decoration: none; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }

        .dashboard { display: grid; grid-template-columns: 1fr 400px; gap: 30px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 25px; }

        .signal-item { background: rgba(0, 255, 136, 0.05); border-left: 4px solid var(--primary); padding: 15px; border-radius: 12px; margin-bottom: 15px; }

        /* Academy & Candlestick Dictionary */
        .edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; margin-top: 40px; }
        .edu-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; transition: 0.4s; }
        .edu-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .edu-img { width: 100%; height: 200px; background: #000; border-radius: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .edu-img img { width: 100%; height: 100%; object-fit: contain; }
        
        .analysis-text { background: rgba(0, 255, 136, 0.03); padding: 15px; border-radius: 10px; font-size: 13px; color: #aaa; line-height: 1.6; }

        .price-action-step { border-left: 4px solid var(--primary); background: rgba(255,255,255,0.02); padding: 20px; margin-bottom: 20px; border-radius: 0 15px 15px 0; }

        @media (max-width: 1000px) { .dashboard { grid-template-columns: 1fr; } .nav-links { display: none; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TradingChart = ({ symbol }) => {
            const containerRef = useRef();
            useEffect(() => {
                new window.TradingView.widget({
                    "width": "100%", "height": 500, "symbol": symbol, "interval": "15",
                    "timezone": "Asia/Kolkata", "theme": "dark", "style": "1", "locale": "en",
                    "container_id": containerRef.current.id
                });
            }, [symbol]);
            return <div id={`tv_${symbol}`} ref={containerRef} style={{ borderRadius: '20px', overflow: 'hidden' }} />;
        };

        const App = () => {
            const [market, setMarket] = useState("FOREXCOM:XAUUSD");

            return (
                <div>
                    <nav className="navbar">
                        <div style={{display:'flex', alignItems:'center', gap:'15px'}}>
                            <h2 style={{margin:0, color: 'var(--primary)', letterSpacing:'1px'}}>AIFREEDOM PRO</h2>
                            <span className="ai-badge">Neural Analyzer v4.0</span>
                        </div>
                        <div style={{display:'flex', gap:'30px'}} className="nav-links">
                            <a href="#signals" style={{color:'#fff', textDecoration:'none', fontWeight:'600'}}>Signals</a>
                            <a href="#academy" style={{color:'#fff', textDecoration:'none', fontWeight:'600'}}>AI Academy</a>
                            <a href="https://wa.me/YOUR_NUMBER" className="btn-vip">GET VIP ACCESS</a>
                        </div>
                    </nav>

                    <div className="container">
                        {/* Live Trading Section */}
                        <section id="signals" style={{paddingTop:'40px'}}>
                            <div className="dashboard">
                                <div>
                                    <div style={{display:'flex', gap:'10px', marginBottom:'20px', overflowX:'auto'}}>
                                        {["FOREXCOM:XAUUSD", "BINANCE:BTCUSDT", "NSE:NIFTY", "NSE:BANKNIFTY", "MCX:GOLD1!"].map(s => (
                                            <button key={s} onClick={() => setMarket(s)} style={{ padding: '10px 20px', borderRadius: '10px', background: market === s ? 'var(--primary)' : '#16181c', color: market === s ? '#000' : '#fff', border: 'none', cursor: 'pointer', fontWeight: 'bold' }}>
                                                {s.split(":")[1]}
                                            </button>
                                        ))}
                                    </div>
                                    <TradingChart symbol={market} />
                                    
                                    <div style={{display:'flex', gap:'15px', marginTop:'25px'}}>
                                        <a href="https://join.dhan.co/?invite=MJABM75999" target="_blank" style={{flex:1, background:'#00d473', color:'#000', padding:'15px', borderRadius:'12px', textAlign:'center', fontWeight:'800', textDecoration:'none'}}>Open Dhan (India)</a>
                                        <a href="https://www.xmglobal.com/referral?token=G9vMlFzRRyBPVDj3QukU3g" target="_blank" style={{flex:1, background:'#fff', color:'#000', padding:'15px', borderRadius:'12px', textAlign:'center', fontWeight:'800', textDecoration:'none'}}>Trade XM (Global)</a>
                                    </div>
                                </div>

                                {/* AI Signal Feed */}
                                <div className="card">
                                    <h3 style={{marginBottom:'20px', color: 'var(--primary)'}}>Live AI Analysis</h3>
                                    
                                    <div className="signal-item">
                                        <div style={{display:'flex', justifyContent:'space-between', fontWeight:'800'}}>
                                            <span>XAU/USD</span> <span style={{color: '#00ff88'}}>BUY</span>
                                        </div>
                                        <p style={{fontSize:'12px', color:'#888', margin:'5px 0'}}>Entry: 2318 | Target: 2345 | SL: 2305</p>
                                        <div style={{fontSize:'11px', color:'gold'}}>Neural Score: 94% Accuracy</div>
                                    </div>

                                    <div className="signal-item" style={{borderColor:'#ff4444', background:'rgba(255,68,68,0.05)'}}>
                                        <div style={{display:'flex', justifyContent:'space-between', fontWeight:'800'}}>
                                            <span>BTC/USDT</span> <span style={{color: '#ff4444'}}>SELL</span>
                                        </div>
                                        <p style={{fontSize:'12px', color:'#888', margin:'5px 0'}}>Entry: 65,200 | Target: 63,000 | SL: 66,500</p>
                                        <div style={{fontSize:'11px', color:'gold'}}>Neural Score: 89% Accuracy</div>
                                    </div>

                                    <div style={{marginTop:'30px', padding:'20px', background:'rgba(255,255,255,0.02)', borderRadius:'15px', border:'1px solid #333'}}>
                                        <h4 style={{color: 'var(--primary)', marginBottom:'10px'}}>Neural Intelligence Note:</h4>
                                        <p style={{fontSize:'12px', color:'#777', lineHeight:'1.5'}}>
                                            "AI analyzing live liquidity sweeps. NIFTY showing institutional accumulation at support levels. High win-rate buy setups forming."
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <hr style={{margin:'80px 0', opacity:'0.1'}} />

                        {/* AI Academy Section */}
                        <section id="academy" style={{paddingBottom:'100px'}}>
                            <div style={{textAlign:'center', marginBottom:'60px'}}>
                                <h1 style={{fontSize:'48px', fontWeight:'800'}}>AI Trading <span style={{color: 'var(--primary)'}}>Academy</span></h1>
                                <p style={{color:'#666'}}>Mastering Candlesticks & Price Action Step-by-Step</p>
                            </div>

                            <div className="edu-grid">
                                <div className="edu-card">
                                    <div className="edu-img">
                                        <img src="https://www.tradingwithrayner.com/wp-content/uploads/2018/11/Hammer.png" alt="Hammer" />
                                    </div>
                                    <h3 style={{color: 'var(--primary)'}}>Bullish Hammer</h3>
                                    <p style={{fontSize:'14px', color:'#777', margin:'10px 0'}}>Trend Reversal Pattern</p>
                                    <div className="analysis-text">
                                        <b>AI Analysis:</b> এই ক্যান্ডেলটি দেখায় যে সেলাররা দাম কমানোর চেষ্টা করলেও বায়াররা শক্তিশালীভাবে ফিরে এসেছে। সাপোর্ট লেভেলে এটি একটি শক্তিশালী বাই সংকেত।
                                    </div>
                                </div>

                                <div className="edu-card">
                                    <div className="edu-img">
                                        <img src="https://www.tradingwithrayner.com/wp-content/uploads/2018/11/Shooting-Star.png" alt="Shooting Star" />
                                    </div>
                                    <h3 style={{color: '#ff4444'}}>Shooting Star</h3>
                                    <p style={{fontSize:'14px', color:'#777', margin:'10px 0'}}>Bearish Reversal Pattern</p>
                                    <div className="analysis-text">
                                        <b>AI Analysis:</b> আপট্রেন্ডের মাথায় এই ক্যান্ডেল দেখা দিলে বুঝতে হবে বায়াররা ক্লান্ত হয়ে গেছে। এটি একটি শক্তিশালী সেল সংকেত।
                                    </div>
                                </div>

                                <div className="edu-card">
                                    <div className="edu-img">
                                        <img src="https://www.tradingwithrayner.com/wp-content/uploads/2018/11/Bullish-Engulfing.png" alt="Engulfing" />
                                    </div>
                                    <h3 style={{color: 'var(--primary)'}}>Bullish Engulfing</h3>
                                    <p style={{fontSize:'14px', color:'#777', margin:'10px 0'}}>Momentum Confirmation</p>
                                    <div className="analysis-text">
                                        <b>AI Analysis:</b> যখন একটি সবুজ ক্যান্ডেল আগের লাল ক্যান্ডেলকে পুরোপুরি গিলে ফেলে, তখন বুঝতে হবে বায়াররা এখন মার্কেটের নিয়ন্ত্রণ নিয়েছে।
                                    </div>
                                </div>
                            </div>

                            {/* Price Action Steps */}
                            <div style={{marginTop:'70px', padding:'40px', background:'rgba(255,255,255,0.02)', borderRadius:'30px', border:'1px solid rgba(255,255,255,0.05)'}}>
                                <h2 style={{fontSize:'32px', marginBottom:'40px', borderLeft:'6px solid var(--primary)', paddingLeft:'20px'}}>Neural Price Action Strategy</h2>
                                
                                <div className="price-action-step">
                                    <h3>Step 1: Trend Identification (Context)</h3>
                                    <p style={{color:'#777', marginTop:'10px'}}>সবসময় হায়ার টাইমফ্রেমে ট্রেন্ড চেক করুন। ট্রেন্ডের বিপরীতে কখনো ট্রেড নেবেন না।</p>
                                </div>

                                <div className="price-action-step">
                                    <h3>Step 2: Key Level Identification (Level)</h3>
                                    <p style={{color:'#777', marginTop:'10px'}}>সাপোর্ট এবং রেজিস্ট্যান্স জোনগুলো মার্ক করুন যেখানে ব্যাংকগুলো তাদের অর্ডার বসিয়ে রাখে।</p>
                                </div>

                                <div className="price-action-step">
                                    <h3>Step 3: Candlestick Confirmation (Signal)</h3>
                                    <p style={{color:'#777', marginTop:'10px'}}>সাপোর্ট লেভেলে হ্যামার বা এনগালফিং প্যাটার্ন দেখলে তবেই এন্ট্রি নিন। এটি এআই কনফার্মেশন।</p>
                                </div>
                            </div>
                        </section>
                    </div>

                    <footer style={{textAlign:'center', padding:'50px', borderTop:'1px solid rgba(255,255,255,0.05)', color:'#444'}}>
                        <p>© 2026 AIFreedom Global Intelligence Hub. All Rights Reserved.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
