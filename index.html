<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>AIFreedom UltraX — World\'s Most Advanced AI Trading Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --g: #00ffa3; --g-dim: rgba(0,255,163,0.15); --g-glow: rgba(0,255,163,0.3);
            --bg: #020408; --bg1: #050b12; --bg2: #0a111a; --bg3: #111a25;
            --border: rgba(0,255,163,0.12); --border-light: rgba(0,255,163,0.06);
            --text: rgba(255,255,255,0.92); --text-dim: rgba(255,255,255,0.6); --muted: rgba(255,255,255,0.35);
            --red: #ff4466; --red-dim: rgba(255,68,102,0.15);
            --blue: #4488ff; --purple: #a855f7; --orange: #f59e0b;
            --oxan: 'Oxanium', sans-serif; --mono: 'JetBrains Mono', monospace; --inter: 'Inter', sans-serif;
            --card-bg: rgba(10,17,26,0.8);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text); font-family: var(--inter); overflow-x: hidden; }
        
        /* Animated Background */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background-image: 
                linear-gradient(rgba(0,255,163,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,163,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }
        .bg-glow {
            position: fixed; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, var(--g-dim) 0%, transparent 70%);
            pointer-events: none; z-index: 0; animation: floatGlow 15s ease-in-out infinite;
        }
        .bg-glow:nth-child(1) { top: -200px; left: -200px; animation-delay: 0s; }
        .bg-glow:nth-child(2) { bottom: -200px; right: -200px; animation-delay: -5s; background: radial-gradient(circle, var(--red-dim) 0%, transparent 70%); }
        .bg-glow:nth-child(3) { top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -10s; width: 400px; height: 400px; }
        @keyframes floatGlow {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px,-30px) scale(1.1); }
            66% { transform: translate(-20px,20px) scale(0.95); }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--g-dim); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--g); }
        
        /* Navbar */
        nav { 
            position: sticky; top: 0; z-index: 200; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 32px; height: 72px; 
            background: rgba(2,4,8,0.85); backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--border);
        }
        .nav-logo { font-family: var(--oxan); font-size: 20px; font-weight: 800; color: var(--g); letter-spacing: 1.5px; display: flex; align-items: center; gap: 10px; }
        .nav-logo span { color: white; font-weight: 600; }
        .nav-links { display: flex; gap: 8px; }
        .nav-link { 
            padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; 
            color: var(--text-dim); text-decoration: none; transition: all 0.3s; cursor: pointer;
            border: 1px solid transparent;
        }
        .nav-link:hover { color: var(--g); background: var(--g-dim); border-color: var(--border); }
        .nav-link.active { color: var(--g); background: var(--g-dim); border-color: var(--g); }
        .nav-status { display: flex; align-items: center; gap: 8px; font-size: 11px; font-family: var(--mono); }
        .live-pulse { width: 8px; height: 8px; background: var(--g); border-radius: 50%; animation: pulse 1.5s infinite; box-shadow: 0 0 10px var(--g); }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }
        
        /* Main Layout */
        .main-container { max-width: 1600px; margin: 0 auto; padding: 24px 32px; position: relative; z-index: 1; }
        
        /* Hero Stats Bar */
        .stats-bar { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
        }
        .stat-card { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; 
            padding: 20px; position: relative; overflow: hidden; transition: all 0.3s;
        }
        .stat-card:hover { border-color: var(--g); transform: translateY(-2px); box-shadow: 0 10px 40px rgba(0,255,163,0.08); }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--g), transparent);
        }
        .stat-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--g-dim); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .stat-icon svg { width: 18px; height: 18px; color: var(--g); }
        .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-family: var(--mono); }
        .stat-value { font-family: var(--oxan); font-size: 24px; font-weight: 800; color: white; }
        .stat-change { font-size: 11px; margin-top: 4px; font-family: var(--mono); }
        .stat-change.up { color: var(--g); }
        .stat-change.down { color: var(--red); }
        
        /* Grid Layout */
        .dashboard-grid { 
            display: grid; grid-template-columns: 380px 1fr 320px; gap: 20px; margin-bottom: 24px;
        }
        
        /* Bot Panel */
        .bot-panel { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; 
            padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }
        .bot-panel::after {
            content: ''; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, var(--g-dim) 0%, transparent 50%);
            animation: rotate 20s linear infinite; pointer-events: none;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .bot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 14px; position: relative; z-index: 1; }
        .bot-title { font-family: var(--oxan); font-size: 14px; font-weight: 700; letter-spacing: 1px; }
        .bot-status { 
            display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
            padding: 4px 10px; border-radius: 20px; background: var(--g-dim); color: var(--g); font-family: var(--mono);
        }
        .bot-status.inactive { background: var(--red-dim); color: var(--red); }
        
        .signal-display { 
            background: linear-gradient(135deg, rgba(0,255,163,0.05), rgba(0,255,163,0.02)); 
            border-radius: 12px; padding: 24px; text-align: center; 
            border: 1px solid var(--border); margin-bottom: 20px; position: relative; z-index: 1;
            transition: all 0.5s;
        }
        .signal-display.buy { border-color: var(--g); box-shadow: 0 0 30px var(--g-dim); }
        .signal-display.sell { border-color: var(--red); box-shadow: 0 0 30px var(--red-dim); }
        .sig-type { font-family: var(--oxan); font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
        .sig-conf { font-size: 14px; color: var(--text-dim); font-family: var(--mono); }
        .sig-status { font-size: 11px; color: var(--muted); margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .bot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; position: relative; z-index: 1; }
        .bot-stat { 
            background: rgba(255,255,255,0.02); padding: 14px; border-radius: 10px; 
            border: 1px solid var(--border-light); transition: all 0.3s;
        }
        .bot-stat:hover { border-color: var(--border); background: rgba(255,255,255,0.04); }
        .bot-stat span { font-size: 9px; color: var(--muted); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; font-family: var(--mono); }
        .bot-stat b { font-size: 14px; color: white; font-family: var(--oxan); }
        .bot-stat .value-green { color: var(--g); }
        .bot-stat .value-red { color: var(--red); }
        
        .btn-action { 
            width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 800; 
            cursor: pointer; font-family: var(--oxan); text-transform: uppercase; transition: all 0.3s; 
            font-size: 13px; letter-spacing: 1px; position: relative; z-index: 1; overflow: hidden;
        }
        .btn-action::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-action:hover::before { left: 100%; }
        .btn-on { background: linear-gradient(135deg, var(--g), #00cc82); color: black; box-shadow: 0 4px 20px var(--g-dim); }
        .btn-on:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--g-glow); }
        .btn-off { background: linear-gradient(135deg, var(--red), #cc3355); color: white; box-shadow: 0 4px 20px var(--red-dim); }
        .btn-off:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,68,102,0.3); }
        
        .analysis-log { 
            margin-top: 20px; height: 140px; overflow-y: auto; background: #000; 
            padding: 14px; border-radius: 10px; font-size: 10px; line-height: 1.8; 
            font-family: var(--mono); border: 1px solid var(--border-light); position: relative; z-index: 1;
        }
        .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log-time { color: var(--muted); margin-right: 8px; }
        .log-buy { color: var(--g); }
        .log-sell { color: var(--red); }
        .log-info { color: var(--blue); }
        .log-warn { color: var(--orange); }
        
        /* Chart Section */
        .chart-section { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; 
            overflow: hidden; display: flex; flex-direction: column;
        }
        .chart-header { 
            padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            background: var(--bg2); border-bottom: 1px solid var(--border);
        }
        .chart-pair { font-family: var(--oxan); font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .pair-badge { 
            background: var(--g-dim); color: var(--g); padding: 2px 8px; border-radius: 4px; 
            font-size: 10px; font-family: var(--mono);
        }
        .chart-controls { display: flex; gap: 8px; }
        .chart-btn { 
            background: transparent; border: 1px solid var(--border); color: var(--text-dim); 
            padding: 6px 14px; border-radius: 6px; font-size: 11px; cursor: pointer; 
            font-family: var(--mono); transition: all 0.3s;
        }
        .chart-btn:hover, .chart-btn.active { border-color: var(--g); color: var(--g); background: var(--g-dim); }
        
        .chart-tabs { 
            display: flex; gap: 4px; padding: 12px 16px; background: var(--bg2); 
            border-bottom: 1px solid var(--border); overflow-x: auto;
        }
        .chart-tab { 
            background: transparent; border: 1px solid var(--border); color: var(--muted); 
            padding: 8px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; 
            font-family: var(--mono); font-weight: 600; transition: all 0.3s; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
        }
        .chart-tab:hover { border-color: var(--g); color: var(--text); }
        .chart-tab.active { background: var(--g-dim); border-color: var(--g); color: var(--g); }
        .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
        .chart-tab.active .tab-dot { background: var(--g); box-shadow: 0 0 6px var(--g); }
        
        .chart-container { flex: 1; min-height: 400px; position: relative; }
        .chart-placeholder {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--muted);
            font-family: var(--mono); font-size: 12px;
        }
        .chart-placeholder svg { margin-bottom: 16px; opacity: 0.5; }
        
        .chart-analysis { 
            padding: 16px 20px; background: var(--bg2); border-top: 1px solid var(--border);
            font-size: 12px; line-height: 1.6;
        }
        .analysis-title { color: var(--g); font-weight: 700; font-family: var(--oxan); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .analysis-text { color: var(--text-dim); }
        .analysis-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .analysis-tag { 
            background: var(--g-dim); color: var(--g); padding: 4px 10px; border-radius: 4px; 
            font-size: 10px; font-family: var(--mono); border: 1px solid var(--border);
        }
        
        /* Side Panel */
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        
        .panel-card { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; 
            padding: 20px; position: relative; overflow: hidden;
        }
        .panel-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--g), transparent);
        }
        .panel-title { 
            font-family: var(--oxan); font-size: 13px; font-weight: 700; margin-bottom: 16px; 
            display: flex; align-items: center; justify-content: space-between;
        }
        .panel-title span { color: var(--muted); font-size: 10px; font-family: var(--mono); }
        
        /* Risk Calculator */
        .calc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calc-label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
        .calc-input { 
            background: var(--bg1); border: 1px solid var(--border); color: white; 
            padding: 8px 12px; border-radius: 6px; font-family: var(--mono); font-size: 12px; 
            width: 120px; text-align: right; outline: none; transition: all 0.3s;
        }
        .calc-input:focus { border-color: var(--g); box-shadow: 0 0 10px var(--g-dim); }
        .calc-result { 
            background: linear-gradient(135deg, var(--g-dim), transparent); 
            border: 1px solid var(--border); border-radius: 8px; padding: 12px; 
            margin-top: 12px; text-align: center;
        }
        .calc-result-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .calc-result-value { font-family: var(--oxan); font-size: 18px; font-weight: 800; color: var(--g); margin-top: 4px; }
        
        /* Scanner */
        .scanner-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 0; border-bottom: 1px solid var(--border-light);
        }
        .scanner-item:last-child { border-bottom: none; }
        .scanner-pair { font-family: var(--mono); font-size: 12px; font-weight: 600; }
        .scanner-signal { 
            font-size: 10px; padding: 3px 8px; border-radius: 4px; font-family: var(--mono); font-weight: 600;
        }
        .scanner-signal.buy { background: var(--g-dim); color: var(--g); }
        .scanner-signal.sell { background: var(--red-dim); color: var(--red); }
        .scanner-signal.neutral { background: rgba(255,255,255,0.05); color: var(--muted); }
        .scanner-price { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 2px; }
        
        /* News Feed */
        .news-item { 
            padding: 12px 0; border-bottom: 1px solid var(--border-light); cursor: pointer; transition: all 0.3s;
        }
        .news-item:last-child { border-bottom: none; }
        .news-item:hover { padding-left: 8px; }
        .news-time { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-bottom: 4px; }
        .news-title { font-size: 12px; color: var(--text); line-height: 1.5; font-weight: 500; }
        .news-tag { 
            display: inline-block; font-size: 9px; padding: 2px 6px; border-radius: 3px; 
            margin-top: 6px; font-family: var(--mono);
        }
        .news-tag.high { background: var(--red-dim); color: var(--red); }
        .news-tag.medium { background: rgba(245,158,11,0.15); color: var(--orange); }
        .news-tag.low { background: var(--g-dim); color: var(--g); }
        
        /* Performance Section */
        .performance-section { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;
        }
        .perf-card { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; 
            padding: 24px; position: relative; overflow: hidden;
        }
        .perf-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--g), transparent);
        }
        .perf-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .perf-title { font-family: var(--oxan); font-size: 14px; font-weight: 700; }
        .perf-filter { display: flex; gap: 4px; }
        .perf-filter-btn { 
            background: transparent; border: 1px solid var(--border); color: var(--muted); 
            padding: 4px 10px; border-radius: 4px; font-size: 10px; cursor: pointer; 
            font-family: var(--mono); transition: all 0.3s;
        }
        .perf-filter-btn.active { background: var(--g-dim); color: var(--g); border-color: var(--g); }
        
        .trade-row { 
            display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 0.8fr; gap: 12px; 
            padding: 10px 0; border-bottom: 1px solid var(--border-light); align-items: center;
        }
        .trade-row.header { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: var(--mono); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .trade-pair { font-family: var(--mono); font-size: 12px; font-weight: 600; }
        .trade-type { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-family: var(--mono); font-weight: 600; text-align: center; }
        .trade-type.buy { background: var(--g-dim); color: var(--g); }
        .trade-type.sell { background: var(--red-dim); color: var(--red); }
        .trade-entry, .trade-exit { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
        .trade-pnl { font-family: var(--mono); font-size: 12px; font-weight: 700; text-align: right; }
        .trade-pnl.pos { color: var(--g); }
        .trade-pnl.neg { color: var(--red); }
        
        /* Footer */
        footer { 
            text-align: center; padding: 40px; color: var(--muted); font-size: 12px; 
            border-top: 1px solid var(--border); margin-top: 40px; font-family: var(--mono);
        }
        footer a { color: var(--g); text-decoration: none; }
        
        /* Responsive */
        @media (max-width: 1400px) { 
            .dashboard-grid { grid-template-columns: 350px 1fr; } 
            .side-panel { display: none; } 
        }
        @media (max-width: 1100px) { 
            .dashboard-grid { grid-template-columns: 1fr; } 
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .performance-section { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .main-container { padding: 16px; }
            nav { padding: 0 16px; }
            .nav-links { display: none; }
            .stats-bar { grid-template-columns: 1fr; }
            .trade-row { grid-template-columns: 1fr 1fr; gap: 8px; }
            .trade-row.header { display: none; }
        }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        
        /* Progress Bar */
        .progress-bar { 
            width: 100%; height: 4px; background: var(--bg1); border-radius: 2px; 
            overflow: hidden; margin-top: 8px;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, var(--g), #00cc82); 
            border-radius: 2px; transition: width 0.5s ease;
        }
        
        /* Tooltip */
        .tooltip { position: relative; }
        .tooltip::after {
            content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            background: var(--bg2); color: var(--text); padding: 6px 10px; border-radius: 6px;
            font-size: 10px; white-space: nowrap; opacity: 0; pointer-events: none;
            transition: all 0.3s; border: 1px solid var(--border); font-family: var(--mono);
        }
        .tooltip:hover::after { opacity: 1; bottom: calc(100% + 8px); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-glow"></div>
    <div class="bg-glow"></div>
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Icons Component
        const Icon = ({ name, size = 16, color }) => {
            const icons = {
                trendUp: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
                trendDown: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>,
                activity: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
                zap: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,

        function TradingViewWidget({ symbol }) {
            const container = useRef();
            const [loaded, setLoaded] = useState(false);
            
            useEffect(() => {
                setLoaded(false);
                const existing = document.getElementById(`tv_script_${symbol.replace(/[:\\/]/g, '_')}`);
                if (existing) existing.remove();
                
                const script = document.createElement("script");
                script.id = `tv_script_${symbol.replace(/[:\\/]/g, '_')}`;
                script.src = "https://s3.tradingview.com/tv.js";
                script.async = true;
                script.onload = () => {
                    if (window.TradingView && container.current) {
                        container.current.innerHTML = '';
                        new window.TradingView.widget({
                            "width": "100%",
                            "height": 420,
                            "symbol": symbol,
                            "interval": "15",
                            "timezone": "Etc/UTC",
                            "theme": "dark",
                            "style": "1",
                            "locale": "en",
                            "toolbar_bg": "#0a111a",
                            "enable_publishing": false,
                            "hide_top_toolbar": false,
                            "hide_legend": false,
                            "save_image": false,
                            "container_id": container.current.id,
                            "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies"]
                        });
                        setLoaded(true);
                    }
                };
                document.head.appendChild(script);
            }, [symbol]);
            
            return (
                <div style={{ position: 'relative', width: '100%', height: '420px' }}>
                    <div id={`tv_${symbol.replace(/[:\\/]/g, '_')}`} ref={container} style={{ width: '100%', height: '100%', borderRadius: '0 0 8px 8px', overflow: 'hidden' }} />
