<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIFreedom UltraX | AI Trading Platform</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- TradingView -->
  <script src="https://s3.tradingview.com/tv.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#00ff88;
      --bg:#05070a;
      --card:#0d1117;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Plus Jakarta Sans',sans-serif;
    }

    body{
      background:var(--bg);
      color:#fff;
      background-image:
      radial-gradient(circle at top, rgba(0,255,136,.08), transparent 40%);
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 5%;
      background:rgba(0,0,0,.7);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(255,255,255,.08);
      position:sticky;
      top:0;
      z-index:999;
    }

    .logo{
      font-size:28px;
      font-weight:800;
      color:var(--primary);
    }

    .btn{
      background:var(--primary);
      color:#000;
      padding:12px 22px;
      border-radius:12px;
      font-weight:800;
      text-decoration:none;
    }

    .hero{
      padding:100px 5%;
      text-align:center;
    }

    .hero h1{
      font-size:70px;
      font-weight:800;
      line-height:1.1;
    }

    .hero span{
      color:var(--primary);
    }

    .hero p{
      max-width:800px;
      margin:30px auto;
      color:#aaa;
      font-size:20px;
    }

    .dashboard{
      max-width:1400px;
      margin:auto;
      padding:40px 20px;
      display:grid;
      grid-template-columns:1fr 350px;
      gap:25px;
    }

    .card{
      background:var(--card);
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      padding:25px;
    }

    .signal{
      background:rgba(0,255,136,.05);
      border-left:4px solid var(--primary);
      padding:20px;
      border-radius:14px;
      margin-bottom:20px;
    }

    .signal.sell{
      border-left-color:#ff4444;
      background:rgba(255,68,68,.05);
    }

    .academy{
      max-width:1400px;
      margin:100px auto;
      padding:0 20px;
    }

    .academy-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:25px;
      margin-top:40px;
    }

    .edu-card{
      background:var(--card);
      border-radius:24px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      transition:.3s;
    }

    .edu-card:hover{
      transform:translateY(-8px);
      border-color:var(--primary);
    }

    .edu-image{
      height:220px;
      background:#000;
    }

    .edu-image img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .edu-content{
      padding:25px;
    }

    footer{
      text-align:center;
      padding:50px;
      border-top:1px solid rgba(255,255,255,.08);
      color:#666;
    }

    @media(max-width:1000px){
      .dashboard{
        grid-template-columns:1fr;
      }

      .hero h1{
        font-size:45px;
      }
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

const TradingChart = ({symbol}) => {

  const chartRef = useRef();

  useEffect(() => {

    new window.TradingView.widget({
      width:"100%",
      height:550,
      symbol:symbol,
      interval:"15",
      timezone:"Asia/Kolkata",
      theme:"dark",
      style:"1",
      locale:"en",
      container_id:chartRef.current.id
    });

  }, [symbol]);

  return(
    <div
      id={"tv_chart"}
      ref={chartRef}
      style={{
        borderRadius:"20px",
        overflow:"hidden"
      }}
    />
  )
}

const App = () => {

  const [market,setMarket] = useState("FOREXCOM:XAUUSD");

  return(
    <div>

      <nav className="navbar">
        <div className="logo">
          AIFreedom UltraX
        </div>

        <a className="btn" href="#">
          VIP ACCESS
        </a>
      </nav>

      <section className="hero">
        <h1>
          AI Trading <span>Intelligence</span>
        </h1>

        <p>
          World-class AI trading ecosystem with live charts,
          smart money concepts, AI academy and neural signal engine.
        </p>

        <a href="#dashboard" className="btn">
          Launch Dashboard
        </a>
      </section>

      <section className="dashboard" id="dashboard">

        <div className="card">

          <div style={{
            display:"flex",
            gap:"10px",
            marginBottom:"20px",
            flexWrap:"wrap"
          }}>

            {
              [
                "FOREXCOM:XAUUSD",
                "BINANCE:BTCUSDT",
                "NASDAQ:AAPL",
                "NSE:NIFTY"
              ].map(item => (

                <button
                  key={item}
                  onClick={()=>setMarket(item)}
                  style={{
                    padding:"12px 20px",
                    borderRadius:"12px",
                    border:"none",
                    fontWeight:"bold",
                    cursor:"pointer",
                    background:market===item ? "#00ff88" : "#16181c",
                    color:market===item ? "#000" : "#fff"
                  }}
                >
                  {item.split(":")[1]}
                </button>

              ))
            }

          </div>

          <TradingChart symbol={market} />

        </div>

        <div className="card">

          <h2 style={{marginBottom:"25px"}}>
            AI Signal Feed
          </h2>

          <div className="signal">
            <h3>
              GOLD BUY
            </h3>

            <p style={{marginTop:"10px",color:"#aaa"}}>
              Entry: 2314.50
            </p>

            <p style={{color:"#aaa"}}>
              TP: 2345.00
            </p>

            <p style={{color:"#aaa"}}>
              SL: 2302.00
            </p>

            <p style={{
              marginTop:"10px",
              color:"#00ff88",
              fontWeight:"bold"
            }}>
              Win Rate: 96%
            </p>
          </div>

          <div className="signal sell">
            <h3>
              BTC SELL
            </h3>

            <p style={{marginTop:"10px",color:"#aaa"}}>
              Entry: 64800
            </p>

            <p style={{color:"#aaa"}}>
              TP: 61500
            </p>

            <p style={{color:"#aaa"}}>
              SL: 66200
            </p>

            <p style={{
              marginTop:"10px",
              color:"#ff4444",
              fontWeight:"bold"
            }}>
              Win Rate: 89%
            </p>
          </div>

        </div>

      </section>

      <section className="academy">

        <h2 style={{
          textAlign:"center",
          fontSize:"50px"
        }}>
          AI Trading Academy
        </h2>

        <div className="academy-grid">

          <div className="edu-card">

            <div className="edu-image">
              <img src="https://www.tradingwithrayner.com/wp-content/uploads/2018/11/Hammer.png"/>
            </div>

            <div className="edu-content">

              <h3 style={{color:"#00ff88"}}>
                Bullish Hammer
              </h3>

              <p style={{
                marginTop:"15px",
                color:"#aaa"
              }}>
                Strong reversal candlestick pattern
                used in support zones.
              </p>

            </div>

          </div>

          <div className="edu-card">

            <div className="edu-image">
              <img src="https://www.tradingwithrayner.com/wp-content/uploads/2018/11/Shooting-Star.png"/>
            </div>

            <div className="edu-content">

              <h3 style={{color:"#ff4444"}}>
                Shooting Star
              </h3>

              <p style={{
                marginTop:"15px",
                color:"#aaa"
              }}>
                Bearish reversal pattern formed
                at resistance levels.
              </p>

            </div>

          </div>

          <div className="edu-card">

            <div className="edu-image">
              <img src="https://www.tradingwithrayner.com/wp-content/uploads/2018/11/Bullish-Engulfing.png"/>
            </div>

            <div className="edu-content">

              <h3 style={{color:"#00ff88"}}>
                Bullish Engulfing
              </h3>

              <p style={{
                marginTop:"15px",
                color:"#aaa"
              }}>
                Momentum confirmation pattern
                for strong buying pressure.
              </p>

            </div>

          </div>

        </div>

      </section>

      <footer>
        © 2026 AIFreedom UltraX — Neural Trading Intelligence
      </footer>

    </div>
  )
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

</body>
</html>
