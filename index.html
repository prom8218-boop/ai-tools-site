<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>AIFreedom UltraX Pro v4.0 — AI Live Trading Bot & Market Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --g: #00ffa3; --g-dim: rgba(0,255,163,0.12); --g-glow: rgba(0,255,163,0.25); --g-bright: #00ffaa;
            --bg: #020408; --bg1: #050b12; --bg2: #0a111a; --bg3: #111a25; --bg4: #1a2435;
            --border: rgba(0,255,163,0.1); --border-light: rgba(0,255,163,0.05);
            --text: rgba(255,255,255,0.92); --text-dim: rgba(255,255,255,0.6); --muted: rgba(255,255,255,0.32);
            --red: #ff4466; --red-dim: rgba(255,68,102,0.12); --red-glow: rgba(255,68,102,0.25);
            --blue: #4488ff; --purple: #a855f7; --orange: #f59e0b; --cyan: #00d4ff;
            --oxan: 'Oxanium', sans-serif; --mono: 'JetBrains Mono', monospace; --inter: 'Inter', sans-serif;
            --card-bg: rgba(10,17,26,0.85);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text); font-family: var(--inter); overflow-x: hidden; }
        
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background-image: 
                linear-gradient(rgba(0,255,163,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,163,0.025) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none;
        }
        .bg-glow {
            position: fixed; width: 700px; height: 700px; border-radius: 50%;
            background: radial-gradient(circle, var(--g-dim) 0%, transparent 70%);
            pointer-events: none; z-index: 0; animation: floatGlow 18s ease-in-out infinite;
        }
        .bg-glow:nth-child(1) { top: -250px; left: -250px; animation-delay: 0s; }
        .bg-glow:nth-child(2) { bottom: -250px; right: -250px; animation-delay: -6s; background: radial-gradient(circle, var(--red-dim) 0%, transparent 70%); }
        .bg-glow:nth-child(3) { top: 40%; left: 60%; animation-delay: -12s; width: 500px; height: 500px; background: radial-gradient(circle, rgba(68,136,255,0.08) 0%, transparent 70%); }
        @keyframes floatGlow {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(40px,-40px) scale(1.1); }
            66% { transform: translate(-30px,30px) scale(0.95); }
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--g-dim); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--g); }
        
        nav { 
            position: sticky; top: 0; z-index: 200; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 32px; height: 68px; 
            background: rgba(2,4,8,0.9); backdrop-filter: blur(24px); 
            border-bottom: 1px solid var(--border);
        }
        .nav-logo { font-family: var(--oxan); font-size: 18px; font-weight: 800; color: var(--g); letter-spacing: 1.5px; display: flex; align-items: center; gap: 10px; }
        .nav-logo span { color: white; font-weight: 600; }
        .nav-links { display: flex; gap: 6px; }
        .nav-link { 
            padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; 
            color: var(--text-dim); text-decoration: none; transition: all 0.3s; cursor: pointer;
            border: 1px solid transparent; font-family: var(--inter);
        }
        .nav-link:hover { color: var(--g); background: var(--g-dim); border-color: var(--border); }
        .nav-link.active { color: var(--g); background: var(--g-dim); border-color: var(--g); }
        .nav-status { display: flex; align-items: center; gap: 10px; font-size: 11px; font-family: var(--mono); }
        .live-pulse { width: 8px; height: 8px; background: var(--g); border-radius: 50%; animation: pulse 1.5s infinite; box-shadow: 0 0 12px var(--g); }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.4); } 100% { opacity: 1; transform: scale(1); } }
        
        .main-container { max-width: 1700px; margin: 0 auto; padding: 20px 32px; position: relative; z-index: 1; }
        
        /* AI LIVE BOT */
        .ai-bot-hero {
            background: linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 28px; margin-bottom: 24px; position: relative; overflow: hidden;
        }
        .ai-bot-hero::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--g), var(--cyan), var(--purple), var(--g));
            animation: gradientMove 3s linear infinite; background-size: 200% 100%;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        
        .ai-bot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .ai-bot-title {
            font-family: var(--oxan); font-size: 22px; font-weight: 800;
            background: linear-gradient(90deg, var(--g), var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            display: flex; align-items: center; gap: 12px;
        }
        .ai-bot-badge {
            background: var(--g-dim); color: var(--g); padding: 4px 12px; border-radius: 20px;
            font-size: 10px; font-family: var(--mono); font-weight: 700; border: 1px solid var(--border);
            display: flex; align-items: center; gap: 6px;
        }
        .ai-bot-badge .live-pulse { width: 6px; height: 6px; }
        
        .live-ticker-bar {
            display: flex; gap: 16px; overflow-x: auto; padding: 12px 0; margin-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .ticker-item {
            background: var(--bg1); border: 1px solid var(--border-light); border-radius: 10px;
            padding: 12px 16px; min-width: 160px; transition: all 0.3s; cursor: pointer;
        }
        .ticker-item:hover { border-color: var(--g); transform: translateY(-2px); }
        .ticker-item.active { border-color: var(--g); background: var(--g-dim); }
        .ticker-pair { font-family: var(--mono); font-size: 13px; font-weight: 700; color: white; margin-bottom: 6px; }
        .ticker-price { font-family: var(--oxan); font-size: 18px; font-weight: 800; }
        .ticker-price.up { color: var(--g); }
        .ticker-price.down { color: var(--red); }
        .ticker-change { font-size: 10px; font-family: var(--mono); margin-top: 4px; }
        .ticker-change.up { color: var(--g); }
        .ticker-change.down { color: var(--red); }
        
        .ai-signal-section { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .ai-signal-main {
            background: linear-gradient(135deg, rgba(0,255,163,0.08), rgba(0,212,255,0.05));
            border: 2px solid var(--border); border-radius: 16px; padding: 28px;
            text-align: center; position: relative; overflow: hidden; grid-column: span 1;
        }
        .ai-signal-main::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, var(--g-dim) 0%, transparent 70%);
            animation: signalPulse 2s ease-in-out infinite;
        }
        @keyframes signalPulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.05); } }
        .signal-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; font-family: var(--mono); margin-bottom: 12px; position: relative; z-index: 1; }
        .signal-type-big { font-family: var(--oxan); font-size: 32px; font-weight: 800; margin-bottom: 8px; position: relative; z-index: 1; letter-spacing: 1px; }
        .signal-type-big.buy { color: var(--g); text-shadow: 0 0 30px var(--g-glow); }
        .signal-type-big.sell { color: var(--red); text-shadow: 0 0 30px var(--red-glow); }
        .signal-type-big.neutral { color: var(--orange); }
        .signal-conf-big { font-family: var(--oxan); font-size: 48px; font-weight: 800; background: linear-gradient(180deg, white, var(--g)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; position: relative; z-index: 1; line-height: 1; }
        .signal-conf-label { font-size: 11px; color: var(--muted); margin-top: 4px; position: relative; z-index: 1; }
        
        .gauge-container { background: var(--bg1); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gauge-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: var(--mono); margin-bottom: 16px; }
        .gauge-svg { width: 140px; height: 80px; }
        .gauge-value { font-family: var(--oxan); font-size: 24px; font-weight: 800; margin-top: 8px; }
        .gauge-label { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }
        
        .countdown-box { background: var(--bg1); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .countdown-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: var(--mono); margin-bottom: 12px; }
        .countdown-timer { font-family: var(--oxan); font-size: 36px; font-weight: 800; color: var(--cyan); letter-spacing: 2px; }
        .countdown-sub { font-size: 10px; color: var(--muted); margin-top: 8px; font-family: var(--mono); }
        
        .levels-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .level-card { background: var(--bg1); border: 1px solid var(--border-light); border-radius: 12px; padding: 16px; text-align: center; transition: all 0.3s; }
        .level-card:hover { border-color: var(--border); transform: translateY(-2px); }
        .level-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: var(--mono); margin-bottom: 8px; }
        .level-value { font-family: var(--oxan); font-size: 20px; font-weight: 700; }
        .level-value.entry { color: var(--g); }
        .level-value.tp { color: var(--blue); }
        .level-value.sl { color: var(--red); }
        .level-value.rr { color: var(--purple); }
        
        .sentiment-bar { background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .sentiment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .sentiment-title { font-family: var(--oxan); font-size: 14px; font-weight: 700; }
        .sentiment-ratio { font-family: var(--mono); font-size: 12px; color: var(--muted); }
        .sentiment-track { height: 32px; background: var(--bg); border-radius: 8px; overflow: hidden; display: flex; position: relative; }
        .sentiment-fill-buy { height: 100%; background: linear-gradient(90deg, var(--g), #00cc82); transition: width 0.8s ease; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: var(--oxan); }
        .sentiment-fill-sell { height: 100%; background: linear-gradient(90deg, #cc3355, var(--red)); transition: width 0.8s ease; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: var(--oxan); }
        .sentiment-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; color: var(--muted); font-family: var(--mono); }
        
        .orderbook-section { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .orderbook-panel { background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; max-height: 280px; overflow-y: auto; }
        .orderbook-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: var(--mono); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .orderbook-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 6px 0; font-size: 11px; font-family: var(--mono); border-bottom: 1px solid rgba(255,255,255,0.03); }
        .orderbook-row.header { color: var(--muted); font-size: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 4px; }
        .ob-price { text-align: right; }
        .ob-price.buy { color: var(--g); }
        .ob-price.sell { color: var(--red); }
        .ob-amount { text-align: right; color: var(--text-dim); }
        .ob-total { text-align: right; color: var(--muted); }
        
        .ai-analysis-box { background: linear-gradient(135deg, rgba(0,255,163,0.05), transparent); border: 1px solid var(--border); border-radius: 12px; padding: 20px; font-size: 13px; line-height: 1.7; color: var(--text-dim); }
        .ai-analysis-box b { color: var(--g); font-family: var(--oxan); }
        .ai-analysis-box .highlight { color: var(--cyan); font-weight: 600; }
        
        /* STATS */
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; position: relative; overflow: hidden; transition: all 0.3s; }
        .stat-card:hover { border-color: var(--g); transform: translateY(-2px); box-shadow: 0 10px 40px rgba(0,255,163,0.06); }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--g), transparent); }
        .stat-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--g-dim); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-family: var(--mono); }
        .stat-value { font-family: var(--oxan); font-size: 24px; font-weight: 800; color: white; }
        .stat-change { font-size: 11px; margin-top: 4px; font-family: var(--mono); }
        .stat-change.up { color: var(--g); }
        .stat-change.down { color: var(--red); }
        
        .dashboard-grid { display: grid; grid-template-columns: 360px 1fr 300px; gap: 20px; margin-bottom: 24px; }
        
        .bot-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        .bot-panel::after { content: ''; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%; background: radial-gradient(circle, var(--g-dim) 0%, transparent 50%); animation: rotate 25s linear infinite; pointer-events: none; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .bot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; position: relative; z-index: 1; }
        .bot-title { font-family: var(--oxan); font-size: 13px; font-weight: 700; letter-spacing: 1px; }
        .bot-status { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--g-dim); color: var(--g); font-family: var(--mono); }
        .bot-status.inactive { background: var(--red-dim); color: var(--red); }
        
        .signal-display { background: linear-gradient(135deg, rgba(0,255,163,0.05), rgba(0,255,163,0.02)); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid var(--border); margin-bottom: 16px; position: relative; z-index: 1; transition: all 0.5s; }
        .signal-display.buy { border-color: var(--g); box-shadow: 0 0 30px var(--g-dim); }
        .signal-display.sell { border-color: var(--red); box-shadow: 0 0 30px var(--red-dim); }
        .sig-type { font-family: var(--oxan); font-size: 24px; font-weight: 800; margin-bottom: 6px; letter-spacing: 1px; }
        .sig-conf { font-size: 13px; color: var(--text-dim); font-family: var(--mono); }
        .sig-status { font-size: 10px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }
        
        .bot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; position: relative; z-index: 1; }
        .bot-stat { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 10px; border: 1px solid var(--border-light); transition: all 0.3s; }
        .bot-stat:hover { border-color: var(--border); background: rgba(255,255,255,0.04); }
        .bot-stat span { font-size: 9px; color: var(--muted); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; font-family: var(--mono); }
        .bot-stat b { font-size: 13px; color: white; font-family: var(--oxan); }
        .bot-stat .value-green { color: var(--g); }
        .bot-stat .value-red { color: var(--red); }
        
        .btn-action { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; font-family: var(--oxan); text-transform: uppercase; transition: all 0.3s; font-size: 12px; letter-spacing: 1px; position: relative; z-index: 1; overflow: hidden; }
        .btn-action::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
        .btn-action:hover::before { left: 100%; }
        .btn-on { background: linear-gradient(135deg, var(--g), #00cc82); color: black; box-shadow: 0 4px 20px var(--g-dim); }
        .btn-on:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--g-glow); }
        .btn-off { background: linear-gradient(135deg, var(--red), #cc3355); color: white; box-shadow: 0 4px 20px var(--red-dim); }
        .btn-off:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,68,102,0.3); }
        
        .analysis-log { margin-top: 16px; height: 120px; overflow-y: auto; background: #000; padding: 12px; border-radius: 10px; font-size: 10px; line-height: 1.8; font-family: var(--mono); border: 1px solid var(--border-light); position: relative; z-index: 1; }
        .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log-time { color: var(--muted); margin-right: 8px; }
        .log-buy { color: var(--g); }
        .log-sell { color: var(--red); }
        .log-info { color: var(--blue); }
        .log-warn { color: var(--orange); }
        .log-ai { color: var(--cyan); }
        
        .chart-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
        .chart-header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; background: var(--bg2); border-bottom: 1px solid var(--border); }
        .chart-pair { font-family: var(--oxan); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .pair-badge { background: var(--g-dim); color: var(--g); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-family: var(--mono); }
        .chart-controls { display: flex; gap: 6px; }
        .chart-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 5px 12px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: var(--mono); transition: all 0.3s; }
        .chart-btn:hover, .chart-btn.active { border-color: var(--g); color: var(--g); background: var(--g-dim); }
        
        .chart-tabs { display: flex; gap: 4px; padding: 10px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto; }
        .chart-tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; font-size: 11px; cursor: pointer; font-family: var(--mono); font-weight: 600; transition: all 0.3s; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
        .chart-tab:hover { border-color: var(--g); color: var(--text); }
        .chart-tab.active { background: var(--g-dim); border-color: var(--g); color: var(--g); }
        .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
        .chart-tab.active .tab-dot { background: var(--g); box-shadow: 0 0 6px var(--g); }
        
        .chart-container { flex: 1; min-height: 380px; position: relative; }
        
        .chart-analysis { padding: 14px 18px; background: var(--bg2); border-top: 1px solid var(--border); font-size: 12px; line-height: 1.6; }
        .analysis-title { color: var(--g); font-weight: 700; font-family: var(--oxan); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .analysis-text { color: var(--text-dim); }
        .analysis-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .analysis-tag { background: var(--g-dim); color: var(--g); padding: 3px 10px; border-radius: 4px; font-size: 10px; font-family: var(--mono); border: 1px solid var(--border); }
        
        .side-panel { display: flex; flex-direction: column; gap: 16px; }
        
        .panel-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 18px; position: relative; overflow: hidden; }
        .panel-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--g), transparent); }
        .panel-title { font-family: var(--oxan); font-size: 12px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
        .panel-title span { color: var(--muted); font-size: 10px; font-family: var(--mono); }
        
        .calc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calc-label { font-size: 10px; color: var(--muted); font-family: var(--mono); }
        .calc-input { background: var(--bg1); border: 1px solid var(--border); color: white; padding: 7px 10px; border-radius: 6px; font-family: var(--mono); font-size: 11px; width: 110px; text-align: right; outline: none; transition: all 0.3s; }

        function Sparkline({ data, color, height = 40 }) {
            const canvasRef = useRef();
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
                
                const w = rect.width;
                const h = height;
                const min = Math.min(...data);
                const max = Math.max(...data);
                const range = max - min || 1;
                
                ctx.clearRect(0, 0, w, h);
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                
                data.forEach((val, i) => {
                    const x = (i / (data.length - 1)) * w;
                    const y = h - ((val - min) / range) * (h - 8) - 4;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
                
                ctx.lineTo(w, h);
                ctx.lineTo(0, h);
                ctx.closePath();
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, color.replace(')', ', 0.2)').replace('rgb', 'rgba'));
                grad.addColorStop(1, color.replace(')', ', 0)').replace('rgb', 'rgba'));
                ctx.fillStyle = grad;
                ctx.fill();
            }, [data, color, height]);
            
            return <canvas ref={canvasRef} style={{ width: '100%', height: height + 'px' }} />;
        }

        function Gauge({ value, max = 100, color, label }) {
            const percentage = Math.min(100, Math.max(0, (value / max) * 100));
            const angle = (percentage / 100) * 180;
            const rad = (angle - 180) * (Math.PI / 180);
            const cx = 70, cy = 70, r = 50;
            const x = cx + r * Math.cos(rad);
            const y = cy + r * Math.sin(rad);
            
            return (

                    <svg className="gauge-svg" viewBox="0 0 140 80">

                        <circle cx={x} cy={y} r="5" fill={color} style={{ transition: 'all 0.8s ease' }}/>

                    <div className="gauge-value" style={{color}}>{value}%</div>

                return () => clearInterval(interval);

                                        <button className="perf-filter-btn">Win</button>
                                        <button className="perf-filter-btn">Loss</button>
                                    </div>
                                </div>
                                <div className="trade-row header">
                                    <span>Pair</span>
                                    <span>Type</span>
                                    <span>Entry</span>
                                    <span>Exit</span>
                                    <span style={{textAlign:'right'}}>P&L</span>
                                </div>
                                {tradeHistory.map((trade, i) => (
                                    <div key={i} className="trade-row">
                                        <span className="trade-pair">{trade.pair}</span>
                                        <span className={`trade-type ${trade.type.toLowerCase()}`}>{trade.type}</span>
                                        <span className="trade-entry">{trade.entry}</span>
                                        <span className="trade-exit">{trade.exit}</span>
                                        <span className={`trade-pnl ${trade.pos ? 'pos' : 'neg'}`}>{trade.pnl}</span>
                                    </div>
                                ))}
                            </div>

                            <div className="perf-card animate-in" style={{animationDelay: '0.6s'}}>
                                <div className="perf-header">
                                    <span className="perf-title">🎯 Performance Metrics</span>
                                    <div className="perf-filter">
                                        <button className="perf-filter-btn active">Today</button>
                                        <button className="perf-filter-btn">Week</button>
                                        <button className="perf-filter-btn">Month</button>
                                    </div>
                                </div>
                                <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px'}}>
                                    <div className="bot-stat" style={{textAlign: 'center', padding: '20px'}}>
                                        <span>Profit Factor</span>
                                        <b style={{fontSize: '22px', color: 'var(--g)'}}>2.45</b>
                                    </div>
                                    <div className="bot-stat" style={{textAlign: 'center', padding: '20px'}}>
                                        <span>Sharpe Ratio</span>
                                        <b style={{fontSize: '22px', color: 'var(--g)'}}>1.89</b>
                                    </div>
                                    <div className="bot-stat" style={{textAlign: 'center', padding: '20px'}}>
                                        <span>Avg Win</span>
                                        <b style={{fontSize: '22px', color: 'var(--g)'}}>+$425</b>
                                    </div>
                                    <div className="bot-stat" style={{textAlign: 'center', padding: '20px'}}>
                                        <span>Avg Loss</span>
                                        <b style={{fontSize: '22px', color: 'var(--red)'}}>-$185</b>
                                    </div>
                                    <div className="bot-stat" style={{textAlign: 'center', padding: '20px'}}>
                                        <span>Max Drawdown</span>
                                        <b style={{fontSize: '22px', color: 'var(--orange)'}}>3.2%</b>
                                    </div>
                                    <div className="bot-stat" style={{textAlign: 'center', padding: '20px'}}>
                                        <span>Expectancy</span>
                                        <b style={{fontSize: '22px', color: 'var(--g)'}}>+$198</b>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Footer */}
                        <footer>
                            <div style={{marginBottom: '12px'}}>
                                <span style={{color: 'var(--g)', fontFamily: 'var(--oxan)', fontWeight: 800, fontSize: '14px'}}>
                                    AIFREEDOM ULTRAX PRO v4.0
                                </span>
                            </div>
                            <div style={{marginBottom: '8px'}}>
                                World's Most Advanced AI-Powered Trading Intelligence Platform
                            </div>
                            <div style={{fontSize: '11px', color: 'var(--muted)'}}>
                                Neural Engine: GPT-4X Pro | Latency: 12ms | Uptime: 99.99% | 
                                <span style={{color: 'var(--g)'}}> Connected to 15 Liquidity Providers</span>
                            </div>
                            <div style={{marginTop: '16px', display: 'flex', justifyContent: 'center', gap: '20px'}}>
                                <span className="tooltip" data-tip="Secure SSL Encryption"><Icon name="shield" size={16} /></span>
                                <span className="tooltip" data-tip="Global Markets"><Icon name="globe" size={16} /></span>
                                <span className="tooltip" data-tip="Real-time Processing"><Icon name="clock" size={16} /></span>
                                <span className="tooltip" data-tip="AI Powered"><Icon name="cpu" size={16} /></span>
                            </div>
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
