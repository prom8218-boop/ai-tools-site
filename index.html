    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <style>
        :root { --primary: #00ff88; --accent: #FF6B2B; --bg: #05070a; --card: #0c0e12; }
        body {

        .btn-pro { background: var(--primary); color: #000; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 800; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn-pro:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
        
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 25px; }
        .grid-main { display: grid; grid-template-columns: 1fr 380px; gap: 30px; }
        
        /* Academy Section Styles */
        .edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
        .edu-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; transition: 0.3s; }

        .candle-box { width: 100%; height: 160px; background: #000; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        
        .step-item { border-left: 3px solid var(--primary); padding: 10px 25px; margin-bottom: 25px; background: rgba(255,255,255,0.01); }
        .live-dot { height: 10px; width: 10px; background: #ff4444; border-radius: 50%; display: inline-block; animation: blink 1s infinite; margin-right: 8px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        @media (max-width: 900px) { .grid-main { grid-template-columns: 1fr; } .nav-links { display: none; } }
    </style>
</head>
<body>
    <div id="root"></div>

                                </div>

                                </div>

                                <div className="edu-card">
                                    <div className="candle-box">
                                        <h1 style={{color:'gold', fontSize:'60px'}}>+</h1>
                                    </div>
                                    <h3 style={{color: 'gold'}}>Doji (অনিশ্চয়তা)</h3>

                    </div>

                    <footer style={{textAlign:'center', padding:'50px', borderTop:'1px solid #111', color:'#444'}}>
                        <p>© 2026 AIFreedom Pro Intelligence. All Rights Reserved.</p>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
