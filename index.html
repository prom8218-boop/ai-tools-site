<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIFreedom - AI Tools</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (JSX কম্পাইল করার জন্য) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; background-color: #050508;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============================================
    // CONFIGURATION
    // ============================================
    const CONFIG = {
      APP_NAME: "AIFreedom.in",
      FREE_DAILY: 15,
      PRO_PRICE: 299,
      AGENT_NAME: "Aitra",
    };

    // ============================================
    // 33 LANGUAGES
    // ============================================
    const LANGS = [
      { code:"en", name:"English", native:"English", dir:"ltr", flag:"🇺🇸" },
      { code:"hi", name:"Hindi", native:"हिन्दी", dir:"ltr", flag:"🇮🇳" },
      { code:"bn", name:"Bengali", native:"বাংলা", dir:"ltr", flag:"🇧🇩" },
      { code:"ta", name:"Tamil", native:"தமிழ்", dir:"ltr", flag:"🇮🇳" },
      { code:"te", name:"Telugu", native:"తెలుగు", dir:"ltr", flag:"🇮🇳" },
      { code:"mr", name:"Marathi", native:"मराठी", dir:"ltr", flag:"🇮🇳" },
      { code:"gu", name:"Gujarati", native:"ગુજરાતી", dir:"ltr", flag:"🇮🇳" },
      { code:"kn", name:"Kannada", native:"ಕನ್ನಡ", dir:"ltr", flag:"🇮🇳" },
      { code:"ml", name:"Malayalam", native:"മലയാളം", dir:"ltr", flag:"🇮🇳" },
      { code:"pa", name:"Punjabi", native:"ਪੰਜਾਬੀ", dir:"ltr", flag:"🇮🇳" },
      { code:"or", name:"Odia", native:"ଓଡ଼ିଆ", dir:"ltr", flag:"🇮🇳" },
      { code:"as", name:"Assamese", native:"অসমীয়া", dir:"ltr", flag:"🇮🇳" },
      { code:"ur", name:"Urdu", native:"اردو", dir:"rtl", flag:"🇵🇰" },
      { code:"sa", name:"Sanskrit", native:"संस्कृतम्", dir:"ltr", flag:"🕉️" },
      { code:"ne", name:"Nepali", native:"नेपाली", dir:"ltr", flag:"🇳🇵" },
      { code:"ks", name:"Kashmiri", native:"کٲشُر", dir:"rtl", flag:"🇮🇳" },
      { code:"sd", name:"Sindhi", native:"سنڌي", dir:"rtl", flag:"🇵🇰" },
      { code:"kok", name:"Konkani", native:"कोंकणी", dir:"ltr", flag:"🇮🇳" },
      { code:"mai", name:"Maithili", native:"मैथिली", dir:"ltr", flag:"🇮🇳" },
      { code:"mni", name:"Manipuri", native:"মৈতৈলোন্", dir:"ltr", flag:"🇮🇳" },
      { code:"sat", name:"Santali", native:"ᱥᱟᱱᱛᱟᱲᱤ", dir:"ltr", flag:"🇮🇳" },
      { code:"doi", name:"Dogri", native:"डोगरी", dir:"ltr", flag:"🇮🇳" },
      { code:"brx", name:"Bodo", native:"बड़ो", dir:"ltr", flag:"🇮🇳" },
      { code:"zh", name:"Chinese", native:"中文", dir:"ltr", flag:"🇨🇳" },
      { code:"ja", name:"Japanese", native:"日本語", dir:"ltr", flag:"🇯🇵" },
      { code:"ko", name:"Korean", native:"한국어", dir:"ltr", flag:"🇰🇷" },
      { code:"ar", name:"Arabic", native:"العربية", dir:"rtl", flag:"🇸🇦" },
      { code:"fr", name:"French", native:"Français", dir:"ltr", flag:"🇫🇷" },
      { code:"de", name:"German", native:"Deutsch", dir:"ltr", flag:"🇩🇪" },
      { code:"es", name:"Spanish", native:"Español", dir:"ltr", flag:"🇪🇸" },
      { code:"ru", name:"Russian", native:"Русский", dir:"ltr", flag:"🇷🇺" },
      { code:"pt", name:"Portuguese", native:"Português", dir:"ltr", flag:"🇧🇷" },
    ];

    // ============================================
    // AI TOOLS
    // ============================================
    const TOOLS = [
      { id:"chat", icon:"💬", color:"#FF6B2B", free:true, name:"AI Chat", desc:"Unlimited conversation with Gemini AI" },
      { id:"text", icon:"✍️", color:"#E74C3C", free:true, name:"Text Writer", desc:"Blogs, articles, stories, essays" },
      { id:"image", icon:"🎨", color:"#9B59B6", free:true, name:"Image Prompt", desc:"Midjourney, DALL-E, Stable Diffusion prompts" },
      { id:"translate", icon:"🌐", color:"#F39C12", free:true, name:"AI Translator", desc:"33 languages with context awareness" },
      { id:"code", icon:"💻", color:"#2980B9", free:true, name:"Code Generator", desc:"Write & debug in any programming language" },
      { id:"seo", icon:"🔍", color:"#27AE60", free:false, name:"SEO Writer", desc:"Google-ranking articles with keywords" },
      { id:"email", icon:"📧", color:"#E91E63", free:false, name:"Email Pro", desc:"Professional business emails" },
      { id:"social", icon:"📱", color:"#1DA1F2", free:false, name:"Social Media", desc:"Instagram, Twitter, LinkedIn posts" },
      { id:"ad", icon:"📢", color:"#FF5722", free:false, name:"Ad Copywriter", desc:"Facebook/Google ad copies that convert" },
      { id:"resume", icon:"📄", color:"#607D8B", free:false, name:"Resume Builder", desc:"ATS-friendly professional resumes" },
      { id:"yt", icon:"▶️", color:"#FF0000", free:false, name:"YouTube Tools", desc:"Titles, descriptions, tags, scripts" },
      { id:"academic", icon:"🎓", color:"#3F51B5", free:false, name:"Academic AI", desc:"Research papers, summaries, citations" },
    ];

    const AGENT_PROMPT = `You are ${CONFIG.AGENT_NAME}, a helpful AI assistant for ${CONFIG.APP_NAME}. 
    You help users with tools, referrals, Pro plans, tech support, etc. Keep responses concise but helpful.`;

    // ============================================
    // GEMINI API CALLER
    // ============================================
        // ============================================
    // SECURE API CALLER (UPDATED)
    // ============================================
    const callGemini = async (prompt, model = "gemini-1.5-flash") => {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      
      if (data.error) throw new Error(data.error.message || "Something went wrong!");
      return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response";
    };
    const buildPrompt = (toolId, input, langName) => {
      const p = `Respond ONLY in ${langName}. Be helpful, detailed, and natural. `;
      const prompts = {
        chat: `${p}User asks: "${input}". Give a helpful, conversational response.`,
        text: `${p}Write creative, engaging, well-structured content about: "${input}". Use headings, bullet points where appropriate.`,
        image: `${p}Create 3 detailed AI image generation prompts for: "${input}". Include: style, lighting, camera angle, mood, color palette. Format as 1. 2. 3.`,
        translate: `Translate the following text to ${langName}. Return ONLY the translation, no explanations:\n\n"${input}"`,
        code: `Help with: "${input}". Provide clean, well-commented code. Explain the logic in ${langName}. Include example usage.`,
        seo: `${p}Write SEO-optimized article about: "${input}". Include: catchy title, meta description (160 chars), H2 headings, bullet points, and strong CTA.`,
        email: `${p}Write professional email for: "${input}". Include: subject line, greeting, body paragraphs, professional closing.`,
        social: `${p}Create engaging social media content about: "${input}". Provide: Instagram caption, Twitter thread (5 tweets), LinkedIn post.`,
        ad: `${p}Write high-converting ad copy for: "${input}". Include: headline (5 options), body text, CTA button text, target audience.`,
        resume: `${p}Create professional resume content for: "${input}". Include: summary, skills section, experience bullets, ATS keywords.`,
        yt: `${p}Create YouTube content for: "${input}". Include: 5 clickbait titles, SEO description, 15 tags, video script outline.`,
        academic: `${p}Help with academic work: "${input}". Provide: structured summary, key points, citation suggestions, further reading.`,
      };
      return prompts[toolId] || `${p}${input}`;
    };

    // ============================================
    // MAIN APP COMPONENT
    // ============================================
    function App() {
      const [lang, setLang] = useState("en");
      const [showPicker, setShowPicker] = useState(false);
      const [search, setSearch] = useState("");
      const [page, setPage] = useState("home");
      const [activeTool, setTool] = useState(null);
      const [input, setInput] = useState("");
      const [output, setOutput] = useState("");
      const [loading, setLoading] = useState(false);
      const [usage, setUsage] = useState(0);
      const [isPro, setPro] = useState(false);
      const [copied, setCopied] = useState(false);
      const [user, setUser] = useState(null);
      const [showLogin, setShowLogin] = useState(false);
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPass, setLoginPass] = useState("");
      const [chatHistory, setChatHistory] = useState([]);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [earnings, setEarnings] = useState({ referrals: 0, commission: 0, total: 0 });
      
      const [agentOpen, setAgentOpen] = useState(false);
      const [agentMessages, setAgentMessages] = useState([
        { role: "agent", text: "👋 Hi! I'm Aitra, your AI assistant. I can help you use tools, earn money, or answer any questions!" }
      ]);
      const [agentInput, setAgentInput] = useState("");
      const [agentLoading, setAgentLoading] = useState(false);
      
      const outputRef = useRef(null);
      const agentScrollRef = useRef(null);

      useEffect(() => {
        const saved = localStorage.getItem("ai_user");
        if (saved) {
          const u = JSON.parse(saved);
          setUser(u);
          setPro(u.isPro || false);
        }
        setUsage(parseInt(localStorage.getItem("ai_usage") || "0"));
        setLang(localStorage.getItem("ai_lang") || "en");
        setChatHistory(JSON.parse(localStorage.getItem("ai_chat") || "[]"));
        setEarnings(JSON.parse(localStorage.getItem("ai_earn") || '{"referrals":0,"commission":0,"total":0}'));
        
        const agentHist = localStorage.getItem("agent_chat");
        if (agentHist) setAgentMessages(JSON.parse(agentHist));
      }, []);

      useEffect(() => {
        if (agentScrollRef.current) {
          agentScrollRef.current.scrollTop = agentScrollRef.current.scrollHeight;
        }
      }, [agentMessages]);

      const curLang = LANGS.find(l => l.code === lang) || LANGS[0];
      const dir = curLang.dir;

      const changeLang = (code) => {
        setLang(code);
        localStorage.setItem("ai_lang", code);
        setShowPicker(false);
        setSearch("");
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const mockUser = { email: loginEmail, name: loginEmail.split("@")[0], isPro: false, joined: new Date().toISOString() };
        setUser(mockUser);
        localStorage.setItem("ai_user", JSON.stringify(mockUser));
        setShowLogin(false);
        setLoginEmail("");
        setLoginPass("");
      };

      const logout = () => {
        setUser(null);
        setPro(false);
        localStorage.removeItem("ai_user");
        setPage("home");
      };

      const upgradeToPro = () => {
        const updated = { ...user, isPro: true };
        setUser(updated);
        setPro(true);
        localStorage.setItem("ai_user", JSON.stringify(updated));
        alert("🎉 Pro Activated! (Demo mode)");
        setPage("home");
      };

      const run = async () => {
        if (!input.trim()) return;
        const tool = TOOLS.find(t => t.id === activeTool);
        if (!tool.free && !isPro) { setOutput("🔒 This is a Pro feature. Upgrade to unlock!"); return; }
        if (!isPro && usage >= CONFIG.FREE_DAILY) { setOutput(`🔒 Free limit reached (${CONFIG.FREE_DAILY}/day). Upgrade to Pro!`); return; }
        
        setLoading(true); setOutput("");
        try {
          const text = await callGemini(buildPrompt(activeTool, input, curLang.name));
          setOutput(text);
          const n = usage + 1;
          setUsage(n);
          localStorage.setItem("ai_usage", n);
          
          const entry = { tool: activeTool, input, output: text, time: Date.now(), lang };
          const newHistory = [entry, ...chatHistory].slice(0, 50);
          setChatHistory(newHistory);
          localStorage.setItem("ai_chat", JSON.stringify(newHistory));
        } catch(e) { setOutput("❌ Error: " + e.message); } finally { setLoading(false); }
      };

      const sendAgentMessage = async () => {
        if (!agentInput.trim()) return;
        const userMsg = { role: "user", text: agentInput };
        const newMessages = [...agentMessages, userMsg];
        setAgentMessages(newMessages); setAgentInput(""); setAgentLoading(true);
        
        try {
          const context = `User language: ${curLang.name}. User status: ${isPro ? "Pro" : "Free"}. Usage: ${usage}/${CONFIG.FREE_DAILY}.`;
          const prompt = `${AGENT_PROMPT}\n\n${context}\n\nUser: ${userMsg.text}\n\nAitra:`;
          const response = await callGemini(prompt);
          const finalMessages = [...newMessages, { role: "agent", text: response }];
          setAgentMessages(finalMessages);
          localStorage.setItem("agent_chat", JSON.stringify(finalMessages));
        } catch(e) {
          setAgentMessages([...newMessages, { role: "agent", text: "❌ Sorry, I'm having trouble connecting." }]);
        } finally { setAgentLoading(false); }
      };

      const css = `
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050508; color: #F0F0F0; font-family: 'Segoe UI', system-ui, sans-serif; }
        @keyframes bounce { 0%,80%,100%{transform:scale(0.8);opacity:0.5} 40%{transform:scale(1.2);opacity:1} }
        @keyframes glow { 0%,100%{box-shadow:0 0 20px rgba(255,107,43,0.3)} 50%{box-shadow:0 0 40px rgba(255,107,43,0.6)} }
        @keyframes slideIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .tc:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .tc { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .lb:hover { background: rgba(255,107,43,0.15) !important; border-color: #FF6B2B !important; }
        .lb { transition: all 0.2s; }
        textarea, input, button { outline: none; font-family: inherit; }
        .pro-glow { animation: glow 2s ease-in-out infinite; }
        .animate-in { animation: slideIn 0.5s ease-out; }
        .agent-float { animation: float 3s ease-in-out infinite; cursor: pointer;}
      `;

      // Components like Nav, AgentChat etc. are rendered inline here for brevity
      return (
        <div style={{ background: "#050508", minHeight: "100vh", color: "#F0F0F0", direction: dir, overflowX: "hidden" }}>
          <style>{css}</style>
          
          {/* Simple Nav */}
          <nav style={{ padding: "14px 20px", background: "rgba(5,5,8,0.95)", borderBottom: "1px solid rgba(255,107,43,0.08)", display: "flex", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 100 }}>
            <span onClick={() => setPage("home")} style={{ fontWeight: 900, fontSize: 20, cursor: "pointer", color: "#FF9500" }}>⚡ {CONFIG.APP_NAME}</span>
            <button onClick={() => setPage("pricing")} style={{ padding: "8px 18px", borderRadius: 20, border: "none", background: "linear-gradient(135deg, #FF6B2B, #FF9500)", color: "#fff", fontWeight: 700, cursor: "pointer" }}>Upgrade</button>
          </nav>

          {page === "home" && (
            <div style={{ textAlign: "center", padding: "50px 16px" }}>
              <h1 style={{ fontSize: "clamp(36px, 8vw, 72px)", fontWeight: 900, color: "#fff", marginBottom: 20 }}>AI Freedom For Everyone</h1>
              <p style={{ color: "rgba(255,255,255,0.5)", marginBottom: 40 }}>12 powerful AI tools. 33 languages. Write, code, create, translate.</p>
              
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 18, maxWidth: 1000, margin: "0 auto", textAlign: "left" }}>
                {TOOLS.map(t => (
                  <div key={t.id} className="tc" onClick={() => { setTool(t.id); setPage("tool"); setInput(""); setOutput(""); }} style={{ background: "rgba(255,255,255,0.02)", border: `1.5px solid ${t.color}20`, borderRadius: 18, padding: 24, cursor: "pointer" }}>
                    <div style={{ fontSize: 24, marginBottom: 10 }}>{t.icon}</div>
                    <div style={{ fontSize: 16, fontWeight: 800 }}>{t.name} {!t.free && "(PRO)"}</div>
                    <div style={{ fontSize: 13, color: "rgba(255,255,255,0.4)", marginTop: 5 }}>{t.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {page === "tool" && activeTool && (() => {
            const tool = TOOLS.find(t => t.id === activeTool);
            return (
              <div style={{ maxWidth: 800, margin: "0 auto", padding: "40px 16px" }}>
                <button onClick={() => setPage("home")} style={{ background: "none", border: "none", color: "#FF9500", cursor: "pointer", marginBottom: 20 }}>← Back</button>
                <h1 style={{ fontSize: 24, fontWeight: 800, marginBottom: 20 }}>{tool.icon} {tool.name}</h1>
                <textarea value={input} onChange={e => setInput(e.target.value)} placeholder="Type your prompt here..." style={{ width: "100%", height: 150, padding: 16, borderRadius: 12, background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#fff", fontSize: 16 }} />
                <button onClick={run} disabled={loading} style={{ marginTop: 16, padding: "14px 30px", borderRadius: 12, background: tool.color, color: "#fff", border: "none", fontWeight: 700, cursor: "pointer" }}>{loading ? "Generating..." : "Generate"}</button>
                {output && <div style={{ marginTop: 24, padding: 20, borderRadius: 12, background: "rgba(255,255,255,0.05)", whiteSpace: "pre-wrap", lineHeight: 1.6 }}>{output}</div>}
              </div>
            );
          })()}

          {page === "pricing" && (
            <div style={{ textAlign: "center", padding: "50px 16px" }}>
              <h1 style={{ fontSize: 36, fontWeight: 800, marginBottom: 20 }}>Pro Plan</h1>
              <div style={{ background: "rgba(255,255,255,0.05)", padding: 40, borderRadius: 20, maxWidth: 400, margin: "0 auto" }}>
                <div style={{ fontSize: 40, fontWeight: 900, color: "#FF6B2B" }}>₹{CONFIG.PRO_PRICE}</div>
                <p style={{ color: "rgba(255,255,255,0.5)", marginTop: 10 }}>Unlimited access to all tools.</p>
                <button onClick={upgradeToPro} style={{ marginTop: 20, width: "100%", padding: 14, borderRadius: 12, background: "#FF6B2B", color: "#fff", border: "none", fontWeight: 700, cursor: "pointer" }}>Upgrade Now</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================
    // RENDER APP
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
