<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIFreedom - AI Tools</title>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="margin: 0; background-color: #050508;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CONFIG = {
      APP_NAME: "AIFreedom.in",
      FREE_DAILY: 15,
      PRO_PRICE: 299,
      AGENT_NAME: "Aitra",
    };

    // ============================================
    // FIREBASE INITIALIZATION
    // ============================================
    const firebaseConfig = {
      // ⚠️ নিচে আপনার Firebase থেকে পাওয়া আসল API Key বসান
      apiKey: "আপনার_FIREBASE_API_KEY_এখানে_বসাবেন", 
      authDomain: "aifreedom-c0be1.firebaseapp.com",
      projectId: "aifreedom-c0be1",
      storageBucket: "aifreedom-c0be1.appspot.com",
      messagingSenderId: "569502934272",
      appId: "1:569502934272:web:15df91ba7960fc5a87baec"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore(); // Database connected!
    const provider = new firebase.auth.GoogleAuthProvider();

    const TOOLS = [
      { id:"chat", icon:"💬", color:"#FF6B2B", free:true, name:"AI Chat", desc:"Unlimited conversation with Gemini AI" },
      { id:"image", icon:"🎨", color:"#9B59B6", free:true, name:"Image Prompt", desc:"Midjourney, DALL-E, Stable Diffusion prompts" },
      { id:"seo", icon:"🔍", color:"#27AE60", free:false, name:"SEO Writer", desc:"Google-ranking articles with keywords" }
    ];

    const callGemini = async (prompt) => {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || "Something went wrong!");
      return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response";
    };

    function App() {
      const [page, setPage] = useState("home");
      const [activeTool, setTool] = useState(null);
      const [input, setInput] = useState("");
      const [output, setOutput] = useState("");
      const [loading, setLoading] = useState(false);
      const [user, setUser] = useState(null);
      const [credits, setCredits] = useState(0);
      const [showLogin, setShowLogin] = useState(false);

      useEffect(() => {
        auth.onAuthStateChanged(async (userAuth) => {
          if (userAuth) {
            // Database-এ ইউজারের তথ্য খুঁজছে
            const userRef = db.collection('users').doc(userAuth.email);
            const docSnap = await userRef.get();
            
            if (!docSnap.exists) {
              // নতুন ইউজার হলে ডেটাবেসে সেভ করবে
              await userRef.set({
                name: userAuth.displayName,
                email: userAuth.email,
                photo: userAuth.photoURL,
                credits: CONFIG.FREE_DAILY,
                isPro: false
              });
              setCredits(CONFIG.FREE_DAILY);
              setUser({ email: userAuth.email, name: userAuth.displayName, photo: userAuth.photoURL, isPro: false });
            } else {
              // পুরোনো ইউজার হলে ডেটাবেস থেকে ডেটা লোড করবে
              const data = docSnap.data();
              setCredits(data.credits);
              setUser({ email: data.email, name: data.name, photo: data.photo, isPro: data.isPro });
            }
          } else {
            setUser(null);
          }
        });
      }, []);

      const handleGoogleLogin = async () => {
        try {
          await auth.signInWithPopup(provider);
          setShowLogin(false);
        } catch (error) {
          alert("Login Failed: " + error.message);
        }
      };

      const logout = () => { auth.signOut(); setPage("home"); };

      const run = async () => {
        if (!user) return alert("Please login to use tools!");
        if (credits <= 0 && !user.isPro) return alert("Not enough credits! Please upgrade to Pro.");
        if (!input.trim()) return;

        setLoading(true); setOutput("");
        try {
          const text = await callGemini(`Respond in English: ${input}`);
          setOutput(text);
          
          // ক্রেডিট কমানো হচ্ছে ডেটাবেস থেকে
          if (!user.isPro) {
            const newCredits = credits - 1;
            setCredits(newCredits);
            await db.collection('users').doc(user.email).update({ credits: newCredits });
          }
        } catch(e) { 
          setOutput("❌ Error: " + e.message); 
        } finally { 
          setLoading(false); 
        }
      };

      return (
        <div style={{ background: "#050508", minHeight: "100vh", color: "#F0F0F0", fontFamily: 'sans-serif' }}>
          
          {/* Navbar */}
          <nav style={{ padding: "14px 20px", background: "rgba(5,5,8,0.95)", borderBottom: "1px solid rgba(255,107,43,0.08)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span onClick={() => setPage("home")} style={{ fontWeight: 900, fontSize: 20, cursor: "pointer", color: "#FF9500" }}>⚡ {CONFIG.APP_NAME}</span>
            
            {user ? (
              <div style={{ display: "flex", alignItems: "center", gap: 15 }}>
                <span style={{ background: "rgba(255,107,43,0.1)", color: "#FF6B2B", padding: "5px 12px", borderRadius: 15, fontWeight: "bold" }}>
                  🪙 {credits} Credits
                </span>
                <img src={user.photo} style={{ width: 32, height: 32, borderRadius: "50%" }} alt="User" />
                <button onClick={logout} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.5)", cursor: "pointer" }}>Logout</button>
              </div>
            ) : (
              <button onClick={() => setShowLogin(true)} style={{ padding: "8px 18px", borderRadius: 20, border: "none", background: "linear-gradient(135deg, #FF6B2B, #FF9500)", color: "#fff", fontWeight: 700, cursor: "pointer" }}>Login</button>
            )}
          </nav>

          {/* Login Modal */}
          {showLogin && (
            <div onClick={() => setShowLogin(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000 }}>
              <div onClick={e => e.stopPropagation()} style={{ background: "#13131A", borderRadius: 24, padding: "40px", textAlign: "center", width: "90%", maxWidth: 400 }}>
                <h2 style={{ marginBottom: 30 }}>Login to Continue</h2>
                <button onClick={handleGoogleLogin} style={{ width: "100%", padding: "14px", borderRadius: 12, background: "#fff", color: "#000", fontWeight: 700, cursor: "pointer", border: "none", fontSize: 16 }}>
                  Continue with Google
                </button>
              </div>
            </div>
          )}

          {/* Home Page */}
          {page === "home" && (
            <div style={{ textAlign: "center", padding: "50px 16px" }}>
              <h1 style={{ fontSize: 40, fontWeight: 900, color: "#fff", marginBottom: 20 }}>AI Tools Collection</h1>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 18, maxWidth: 1000, margin: "0 auto", textAlign: "left" }}>
                {TOOLS.map(t => (
                  <div key={t.id} onClick={() => { setTool(t.id); setPage("tool"); setInput(""); setOutput(""); }} style={{ background: "rgba(255,255,255,0.02)", border: `1.5px solid ${t.color}20`, borderRadius: 18, padding: 24, cursor: "pointer" }}>
                    <div style={{ fontSize: 24, marginBottom: 10 }}>{t.icon}</div>
                    <div style={{ fontSize: 16, fontWeight: 800 }}>{t.name} {!t.free && "(PRO)"}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Tool Page */}
          {page === "tool" && activeTool && (
            <div style={{ maxWidth: 800, margin: "0 auto", padding: "40px 16px" }}>
              <button onClick={() => setPage("home")} style={{ background: "none", border: "none", color: "#FF9500", cursor: "pointer", marginBottom: 20 }}>← Back</button>
              <textarea value={input} onChange={e => setInput(e.target.value)} placeholder="Type prompt..." style={{ width: "100%", height: 150, padding: 16, borderRadius: 12, background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#fff", fontSize: 16 }} />
              <button onClick={run} disabled={loading} style={{ marginTop: 16, padding: "14px 30px", borderRadius: 12, background: "#FF6B2B", color: "#fff", border: "none", fontWeight: 700, cursor: "pointer" }}>{loading ? "Generating..." : "Generate (-1 Credit)"}</button>
              {output && <div style={{ marginTop: 24, padding: 20, borderRadius: 12, background: "rgba(255,255,255,0.05)", whiteSpace: "pre-wrap", lineHeight: "1.6" }}>{output}</div>}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
