<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>AIFreedom UltraX — AI Bot & Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --g: #00ffa3; --bg: #020408; --bg1: #050b12; --border: rgba(0,255,163,0.15);
            --text: rgba(255,255,255,0.88); --muted: rgba(255,255,255,0.38);
            --red: #ff4466; --oxan: 'Oxanium', sans-serif; --mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--mono); overflow-x: hidden; }
        
        nav { position: sticky; top: 0; z-index: 200; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 70px; background: rgba(2,4,8,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .nav-logo { font-family: var(--oxan); font-size: 18px; font-weight: 800; color: var(--g); letter-spacing: 1px; }
        
        .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 30px 24px; align-items: start; }
        
        .bot-panel { background: #0a111a; border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .bot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .status-tag { display: flex; align-items: center; gap: 8px; font-size: 9px; text-transform: uppercase; color: var(--g); }
        .live-pulse { width: 8px; height: 8px; background: var(--g); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
        
        .signal-display { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 15px; text-align: center; border: 1px dashed rgba(0,255,163,0.3); margin-bottom: 15px; }
        .sig-type { font-family: var(--oxan); font-size: 24px; font-weight: 800; margin-bottom: 5px; }
        
        .bot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .bot-stat { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }
        .bot-stat span { font-size: 8px; color: var(--muted); display: block; margin-bottom: 4px; }
        .bot-stat b { font-size: 12px; color: white; font-family: var(--oxan); }

        .btn-action { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-family: var(--oxan); text-transform: uppercase; transition: 0.3s; }
        .btn-on { background: var(--g); color: black; }
        .btn-off { background: var(--red); color: white; }

        .analysis-log { margin-top: 15px; height: 100px; overflow-y: auto; background: black; padding: 10px; border-radius: 5px; font-size: 9px; color: #55ffaa; line-height: 1.5; font-family: 'Courier New', monospace; }

        .terminal { background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .term-tabs { padding: 10px; display: flex; gap: 10px; background: #0a111a; }
        .term-tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 4px; font-size: 10px; cursor: pointer; }

        @media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        function TradingViewWidget({ symbol }) {
            const container = useRef();
            useEffect(() => {
                const script = document.createElement("script");
                script.src = "https://s3.tradingview.com/tv.js";
                script.async = true;
                script.onload = () => {
                    if (window.TradingView) {
                        new window.TradingView.widget({
                            "width": "100%", "height": 350, "symbol": symbol,
                            "interval": "1", "timezone": "Etc/UTC", "theme": "dark",
                            "style": "1", "locale": "en", "container_id": container.current.id
                        });
                    }
                };
                document.head.appendChild(script);
            }, [symbol]);
            return <div id={`tv_${symbol.replace(':', '_')}`} ref={container} style={{ borderRadius: '8px', overflow: 'hidden' }} />;
        }

        function App() {
            const [botActive, setBotActive] = useState(true);
            const [tab, setTab] = useState('OANDA:XAUUSD');
            const [logs, setLogs] = useState(["[System] Initializing AI Neural Engine v2.5..."]);
            const [signal, setSignal] = useState({ type: 'SCANNING', conf: '0%', status: 'Analyzing Liquidity' });

            const updateAI = useCallback(() => {
                if (!botActive) return;
                const actions = ['STRONG BUY', 'SCALP SELL', 'BOS ENTRY', 'SMT REVERSAL'];
                const selected = actions[Math.floor(Math.random() * actions.length)];
                const conf = Math.floor(Math.random() * (99 - 88 + 1) + 88) + "%";
                
                setSignal({ type: selected, conf: conf, status: 'Order Block Found' });
                setLogs(prev => [`[Bot] ${selected} detected at market price. Conf: ${conf}`, ...prev].slice(0, 15));
            }, [botActive]);

            useEffect(() => {
                const interval = setInterval(updateAI, 6000);
                return () => clearInterval(interval);
            }, [updateAI]);

            return (
                <div>
                    <nav>
                        <div className="nav-logo">AIFREEDOM <span>ULTRAX BOT</span></div>
                        <div className="status-tag">
                            <div className="live-pulse"></div> LIVE DATA
                        </div>
                    </nav>

                    <div className="hero">
                        <div className="bot-panel">
                            <div className="bot-header">
                                <span style={{fontSize:'12px', fontWeight:'bold'}}>AUTO-TRADER PANEL</span>
                                <span style={{fontSize:'10px', color: botActive ? 'var(--g)' : 'var(--red)'}}>
                                    {botActive ? '● ACTIVE' : '○ PAUSED'}
                                </span>
                            </div>

                            <div className="signal-display">
                                <div className="sig-type" style={{color: signal.type.includes('BUY') ? 'var(--g)' : 'var(--red)'}}>
                                    {signal.type}
                                </div>
                                <div style={{fontSize:'10px', color:'var(--muted)'}}>{signal.status}</div>
                            </div>

                            <div className="bot-grid">
                                <div className="bot-stat"><span>Confidence</span><b>{signal.conf}</b></div>
                                <div className="bot-stat"><span>Pair</span><b>{tab.split(':')[1]}</b></div>
                                <div className="bot-stat"><span>Neural Score</span><b>9.8/10</b></div>
                                <div className="bot-stat"><span>P&L Daily</span><b style={{color:'var(--g)'}}>+$284.10</b></div>
                            </div>

                            <button className={`btn-action ${botActive ? 'btn-off' : 'btn-on'}`} onClick={() => setBotActive(!botActive)}>
                                {botActive ? "Disable AI Bot" : "Enable AI Bot"}
                            </button>

                            <div className="analysis-log">
                                {logs.map((l, i) => <div key={i}>{l}</div>)}
                            </div>
                        </div>

                        <div className="terminal">
                            <div className="term-tabs">
                                <button className="term-tab" onClick={() => setTab('OANDA:XAUUSD')}>XAUUSD</button>
                                <button className="term-tab" onClick={() => setTab('BINANCE:BTCUSDT')}>BTCUSDT</button>
                            </div>
                            <TradingViewWidget symbol={tab} />
                            <div style={{padding:'15px', fontSize:'11px', background:'#050b12'}}>
                                <b style={{color:'var(--g)'}}>INSTITUTIONAL ANALYSIS:</b> Market sweeping sell-side liquidity. Waiting for MSS on lower timeframe.
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
