<!DOCTYPE html>
<html lang="en">
<head>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        :root { --primary: #00ff88; --accent: #FF6B2B; --bg: #05070a; --card: rgba(12, 14, 18, 0.9); }
        * { box-sizing: border-box; scroll-behavior: smooth; }

        body { 
            background: var(--bg);
            background-image: linear-gradient(rgba(5, 7, 10, 0.8), rgba(5, 7, 10, 0.9)), 
                              url('https://images.unsplash.com/photo-1611974717482-98252c6a4932?auto=format&fit=crop&w=2000');

            color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0;

        .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(8, 10, 16, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 255, 136, 0.2); position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        .btn-pro { background: var(--primary); color: #000; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 800; cursor: pointer; text-decoration: none; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
        .btn-pro:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 255, 136, 0.5); }

        .grid-main { display: grid; grid-template-columns: 1fr 400px; gap: 30px; }
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; }

        .edu-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; transition: 0.4s; position: relative; overflow: hidden; }
        .edu-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        
        .pattern-img { width: 100%; height: 200px; border-radius: 12px; margin-bottom: 15px; object-fit: cover; border: 1px solid #333; }
        
        .analysis-tag { font-size: 11px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-bottom: 10px; display: block; }
        
        @media (max-width: 1000px) { .grid-main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="root"></div>

                                    </div>

                                    </div>
                                    <div>

            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
