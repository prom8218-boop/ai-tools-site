<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFreedom Pro - AI Trading & Creative Hub</title>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- TradingView API -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #00ff88; --accent: #FF6B2B; --bg: #05070a; }
        body { background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; }
        .sidebar { width: 280px; border-right: 1px solid rgba(255,255,255,0.05); padding: 25px; position: fixed; height: 100vh; background: #080a10; z-index: 10; }
        .main-content { marginLeft: 280px; flex: 1; padding: 30px; min-height: 100vh; margin-left: 280px; }
        .gradient-text { background: linear-gradient(45deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .btn-sidebar { width: 100%; padding: 14px; border: none; background: none; color: #888; text-align: left; cursor: pointer; border-radius: 12px; margin-bottom: 8px; font-weight: 600; transition: 0.3s; }
        .btn-sidebar.active { background: rgba(0, 255, 136, 0.1); color: var(--primary); }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; }
        .live-dot { height: 8px; width: 8px; background: #ff4444; border-radius: 50%; display: inline-block; animation: blink 1s infinite; margin-right: 8px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // TradingView Widget Component
        const TradingChart = ({ symbol }) => {
            const containerRef = useRef();
            useEffect(() => {
                new window.TradingView.widget({
                    "width": "100%", "height": 500, "symbol": symbol, "interval": "D",
                    "timezone": "Asia/Kolkata", "theme": "dark", "style": "1", "locale": "en",
                    "enable_publishing": false, "allow_symbol_change": true, "container_id": containerRef.current.id
                });
            }, [symbol]);
            return <div id={`tv_${symbol}`} ref={containerRef} style={{ borderRadius: '15px', overflow: 'hidden' }} />;
        };

        const App = () => {
            const [view, setView] = useState("trade");
            const [market, setMarket] = useState("NSE:NIFTY");
            const [signals, setSignals] = useState([
                { asset: "NIFTY 50", type: "BUY", price: "22,480", tp: "22,650", sl: "22,390", conf: 92, status: "RSI Confirmed" },
                { asset: "BTC/USDT", type: "HOLD", price: "64,120", tp: "--", sl: "--", conf: 40, status: "Low Vol" },
                { asset: "GOLD (MCX)", type: "SELL", price: "71,200", tp: "70,800", sl: "71,450", conf: 85, status: "Resistance" }
            ]);

            return (
                <div style={{ display: "flex" }}>
                    {/* Sidebar */}
                    <div className="sidebar">
                        <h2 className="gradient-text">AIFREEDOM PRO</h2>
                        <div style={{ marginTop: '40px' }}>
                            <p style={{ fontSize: '11px', color: '#555', marginBottom: '15px', letterSpacing: '1px' }}>DASHBOARD</p>
                            <button className={`btn-sidebar ${view === 'trade' ? 'active' : ''}`} onClick={() => setView('trade')}>📊 AI Trade Station</button>
                            <button className={`btn-sidebar ${view === 'creative' ? 'active' : ''}`} onClick={() => setView('creative')}>🎨 AI Creative Suite</button>
                            
                            <p style={{ fontSize: '11px', color: '#555', marginTop: '30px', marginBottom: '15px', letterSpacing: '1px' }}>OFFICIAL BROKERS</p>
                            <a href="https://join.dhan.co/?invite=MJABM75999" target="_blank" style={{textDecoration:'none'}}>
                                <div className="card" style={{marginBottom:'10px', borderColor:'rgba(0,255,136,0.2)'}}>
                                    <span style={{color: 'var(--primary)', fontWeight:'bold', fontSize:'14px'}}>Dhan (India) 🇮🇳</span>
                                    <p style={{fontSize:'10px', color:'#777', margin:'5px 0 0'}}>Free TradingView Pro</p>
                                </div>
                            </a>
                            <a href="https://www.xmglobal.com/referral?token=G9vMlFzRRyBPVDj3QukU3g" target="_blank" style={{textDecoration:'none'}}>
                                <div className="card" style={{borderColor:'rgba(255,68,68,0.2)'}}>
                                    <span style={{color: '#ff4444', fontWeight:'bold', fontSize:'14px'}}>XM Global 🌍</span>
                                    <p style={{fontSize:'10px', color:'#777', margin:'5px 0 0'}}>$50 Welcome Bonus</p>
                                </div>
                            </a>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="main-content">
                        {view === 'trade' ? (
                            <div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '30px' }}>
                                    <div>
                                        <h1 style={{ margin: 0 }}>Neural Signal Engine</h1>
                                        <p style={{ color: '#666', margin: '5px 0' }}>Live Market Analysis with 85%+ Accuracy</p>
                                    </div>
                                    <div style={{ display: 'flex', gap: '10px' }}>
                                        <button style={{ background: 'var(--primary)', color: '#000', border: 'none', padding: '12px 20px', borderRadius: '10px', fontWeight: '800', cursor:'pointer' }}>GO PRO</button>
                                    </div>
                                </div>

                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 350px', gap: '30px' }}>
                                    <div>
                                        <div style={{ display: 'flex', gap: '10px', marginBottom: '20px' }}>
                                            {["NSE:NIFTY", "NSE:BANKNIFTY", "MCX:GOLD1!", "BINANCE:BTCUSDT"].map(s => (
                                                <button key={s} onClick={() => setMarket(s)} style={{ padding: '10px 15px', borderRadius: '10px', background: market === s ? 'var(--primary)' : '#16181c', color: market === s ? '#000' : '#fff', border: 'none', cursor: 'pointer', fontWeight: 'bold' }}>
                                                    {s.includes("MCX") ? "Gold MCX" : s.split(":")[1]}
                                                </button>
                                            ))}
                                        </div>
                                        <TradingChart symbol={market} />
                                    </div>

                                    {/* AI Signals */}
                                    <div className="card" style={{ background: '#0c0e12' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                                            <h3 style={{ margin: 0 }}>AI Signals</h3>
                                            <span className="live-dot"></span>
                                        </div>
                                        {signals.map((sig, i) => (
                                            <div key={i} style={{ padding: '15px', background: 'rgba(255,255,255,0.03)', borderRadius: '12px', marginBottom: '15px', border: `1px solid ${sig.type === 'BUY' ? 'rgba(0,255,136,0.1)' : 'rgba(255,68,68,0.1)'}` }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                    <span style={{ fontWeight: 'bold' }}>{sig.asset}</span>
                                                    <span style={{ color: sig.type === 'BUY' ? '#00ff88' : sig.type === 'SELL' ? '#ff4444' : '#888', fontSize: '12px', fontWeight: 'bold' }}>{sig.type}</span>
                                                </div>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '10px', fontSize: '12px', color: '#aaa' }}>
                                                    <span>Entry: {sig.price}</span>
                                                    <span>Conf: <span style={{color:'gold'}}>{sig.conf}%</span></span>
                                                </div>
                                                {sig.type !== 'HOLD' && (
                                                    <div style={{ marginTop: '10px', display: 'flex', gap: '5px' }}>
                                                        <div style={{ flex: 1, background: '#00ff8811', padding: '5px', borderRadius: '5px', fontSize: '10px', textAlign: 'center' }}>T: {sig.tp}</div>
                                                        <div style={{ flex: 1, background: '#ff444411', padding: '5px', borderRadius: '5px', fontSize: '10px', textAlign: 'center' }}>S: {sig.sl}</div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                        <p style={{fontSize:'11px', color:'#555', textAlign:'center'}}>* Signals are for educational purpose. Connect with Dhan/XM for better accuracy.</p>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div style={{textAlign:'center', padding:'100px 0'}}>
                                <h1>Creative Suite (Photo/Video AI)</h1>
                                <p style={{color:'#666'}}>Coming Soon: High-speed Neural Image Generation & AI Video Editor.</p>
                                <button onClick={() => setView('trade')} className="btn-sidebar active" style={{width:'auto', display:'inline-block'}}>Back to Trading</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
