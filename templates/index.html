<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTools.in | Premium AI SaaS Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .premium-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans premium-gradient min-h-screen flex flex-col">

    <nav class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-cyan-500 p-2 rounded-xl text-slate-950 font-black tracking-wider shadow-lg shadow-cyan-500/30">AL</div>
            <h1 class="text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">ALTOOLS.IN</h1>
        </div>
        
        <div id="auth-area" class="flex items-center gap-4">
            <div id="google-btn"></div>
            
            <div id="user-profile" class="hidden flex items-center gap-3 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-2xl">
                <img id="user-avatar" src="" alt="Avatar" class="w-8 h-8 rounded-full border border-cyan-500/30">
                <span id="user-name" class="text-sm font-semibold text-slate-200"></span>
                <button onclick="logout()" class="text-xs text-rose-400 hover:text-rose-500 font-bold ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 py-12 pb-24">
        
        <section class="lg:col-span-5 bg-slate-900/40 border border-slate-800/80 rounded-3xl p-6 backdrop-blur-sm flex flex-col justify-between min-h-[550px]">
            <div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                    <h3 class="font-bold text-lg text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-robot"></i> Multi-Model AI Studio</h3>
                    <span class="text-xs text-slate-500 font-mono">Token: Unlimited</span>
                </div>
                
                <div class="bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs p-3 rounded-xl mb-4 font-medium">
                    💡 <strong>Tip:</strong> Type normal text to chat, or type <code class="text-amber-400 font-bold">/image [your prompt]</code> to generate ultra-realistic AI photos!
                </div>

                <div class="h-80 overflow-y-auto space-y-4 pr-2 text-sm" id="ai-chat-box">
                    <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800/60 max-w-[85%] text-slate-300">
                        System fully initialized. Please sign in with Google to explore authenticated dynamic pipelines.
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <div class="flex gap-2 p-2 bg-slate-900/90 border border-slate-800 rounded-2xl focus-within:border-cyan-500/50 transition">
                    <input type="text" id="ai-input" placeholder="Ask AI anything or write /image..." class="w-full bg-transparent px-3 py-2 text-sm text-white focus:outline-none">
                    <button onclick="askAI()" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 p-2.5 rounded-xl font-bold transition flex items-center justify-center w-10 h-10"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <section class="lg:col-span-7 bg-slate-900/40 border border-slate-800/80 rounded-3xl p-6 backdrop-blur-sm flex flex-col justify-between">
            <div>
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-800 pb-4 mb-4">
                    <h3 class="font-bold text-lg text-fuchsia-400 flex items-center gap-2"><i class="fa-solid fa-terminal"></i> Cloud Compiler Engine</h3>
                    <div>
                        <select id="language" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-200 focus:outline-none focus:border-fuchsia-500">
                            <option value="python">Python 3.11</option>
                            <option value="java">Java SE 17</option>
                            <option value="cpp">C++ (GCC 13)</option>
                            <option value="c">C Compiler</option>
                        </select>
                    </div>
                </div>
                <div class="rounded-2xl overflow-hidden border border-slate-800">
                    <textarea id="code-editor" rows="11" class="w-full font-mono bg-slate-950 p-4 text-emerald-400 text-sm focus:outline-none block" placeholder="# Write production code modules here..."></textarea>
                </div>
            </div>

            <div class="mt-4 space-y-4">
                <button onclick="runCode()" class="w-full bg-gradient-to-r from-fuchsia-500 via-purple-600 to-indigo-600 py-3.5 rounded-2xl font-bold text-sm transition shadow-lg shadow-fuchsia-500/10 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play text-xs"></i> Execute Isolation Build Process
                </button>
                <div>
                    <pre id="output" class="bg-slate-950 p-4 rounded-xl border border-slate-900 font-mono text-xs text-slate-300 min-h-[80px] overflow-x-auto shadow-inner" placeholder="Console output will render here..."></pre>
                </div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
