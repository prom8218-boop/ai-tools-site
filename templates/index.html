<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Suite - Chat, Generate & Analyze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800">
    <div class="min-h-screen text-white">
        <!-- Header -->
        <header class="bg-slate-900/80 border-b border-slate-700 backdrop-blur-sm">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    <i class="fas fa-rocket"></i> AI Tools Suite
                </h1>
                <div id="user-profile" class="hidden flex items-center gap-3">
                    <img id="user-avatar" src="" alt="User" class="w-8 h-8 rounded-full">
                    <span id="user-name" class="text-sm"></span>
                    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm">Logout</button>
                </div>
                <div id="google-btn"></div>
            </div>
        </header>

        <!-- Main Container -->
        <div class="max-w-7xl mx-auto px-4 py-6">
            <!-- Tab Navigation -->
            <div class="flex gap-2 mb-6 border-b border-slate-700 overflow-x-auto">
                <button onclick="switchTab('chat')" class="tab-btn active px-4 py-2 border-b-2 border-cyan-400 text-cyan-400 whitespace-nowrap">
                    <i class="fas fa-message"></i> AI Chat
                </button>
                <button onclick="switchTab('code')" class="tab-btn px-4 py-2 text-slate-400 hover:text-white whitespace-nowrap">
                    <i class="fas fa-code"></i> Code Executor
                </button>
                <button onclick="switchTab('analyzer')" class="tab-btn px-4 py-2 text-slate-400 hover:text-white whitespace-nowrap">
                    <i class="fas fa-magnifying-glass"></i> Code Analyzer
                </button>
            </div>

            <!-- Chat Tab -->
            <div id="chat-tab" class="tab-content grid grid-cols-1 lg:grid-cols-3 gap-4">
                <div class="lg:col-span-2">
                    <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                        <h2 class="text-lg font-semibold mb-4 text-cyan-400">💬 AI Assistant</h2>
                        <div id="ai-chat-box" class="bg-slate-950 h-96 overflow-y-auto mb-4 p-4 rounded border border-slate-700 text-sm">
                            <div class="text-slate-400"><i class="fas fa-circle-check"></i> Welcome! Use /image to generate images.</div>
                        </div>
                        <div class="flex gap-2">
                            <input id="ai-input" type="text" placeholder="Ask AI anything... (or /image prompt)" 
                                   class="flex-1 bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:border-cyan-500" 
                                   onkeypress="if(event.key==='Enter') askAI()">
                            <button onclick="askAI()" class="bg-cyan-600 hover:bg-cyan-700 px-6 py-2 rounded font-semibold">
                                <i class="fas fa-send"></i> Send
                            </button>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                    <h3 class="text-lg font-semibold mb-4 text-blue-400">📝 Tips</h3>
                    <div class="space-y-3 text-sm text-slate-400">
                        <div class="p-2 bg-slate-800 rounded">
                            <strong class="text-white">Regular Chat:</strong> Ask any question
                        </div>
                        <div class="p-2 bg-slate-800 rounded">
                            <strong class="text-white">Image:</strong> Type /image [description]
                        </div>
                        <div class="p-2 bg-slate-800 rounded">
                            <strong class="text-white">Example:</strong> /image cyberpunk city
                        </div>
                    </div>
                </div>
            </div>

            <!-- Code Executor Tab -->
            <div id="code-tab" class="tab-content hidden">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    <div class="lg:col-span-2">
                        <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-lg font-semibold text-green-400">💻 Code Executor</h2>
                                <select id="code-language" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white">
                                    <option value="python">Python</option>
                                    <option value="cpp">C++</option>
                                    <option value="c">C</option>
                                    <option value="java">Java</option>
                                </select>
                            </div>
                            <textarea id="code-editor" placeholder="Write your code here..." 
                                      class="w-full h-64 bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:border-green-500 font-mono text-sm mb-4"></textarea>
                            <button onclick="runCode()" class="w-full bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-semibold">
                                <i class="fas fa-play"></i> Run Code
                            </button>
                        </div>
                    </div>
                    <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                        <h3 class="text-lg font-semibold mb-4 text-green-400">📤 Output</h3>
                        <div id="output" class="bg-slate-950 border border-slate-600 rounded p-3 h-80 overflow-y-auto text-sm font-mono text-slate-300">
                            Output will appear here...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Code Analyzer Tab (NEW) -->
            <div id="analyzer-tab" class="tab-content hidden">
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
                    <!-- Code Editor -->
                    <div class="lg:col-span-3">
                        <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-lg font-semibold text-purple-400">🔍 Code Analyzer</h2>
                                <select id="analyzer-language" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white text-sm">
                                    <option value="python">Python</option>
                                    <option value="javascript">JavaScript</option>
                                    <option value="java">Java</option>
                                    <option value="cpp">C++</option>
                                </select>
                            </div>
                            <textarea id="analyzer-code" placeholder="Paste your code here for analysis..." 
                                      class="w-full h-64 bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:border-purple-500 font-mono text-sm mb-4"></textarea>
                            
                            <!-- Analysis Buttons -->
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="analyzeCode()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded font-semibold text-sm">
                                    <i class="fas fa-magnifying-glass"></i> Full Analysis
                                </button>
                                <button onclick="detectBugs()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-semibold text-sm">
                                    <i class="fas fa-bug"></i> Bug Detection
                                </button>
                                <button onclick="analyzePerformance()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-semibold text-sm">
                                    <i class="fas fa-chart-line"></i> Performance
                                </button>
                                <button onclick="getRefactoringTips()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-semibold text-sm">
                                    <i class="fas fa-lightbulb"></i> Refactoring
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Analysis Results Panel -->
                    <div class="lg:col-span-1">
                        <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4 sticky top-4 max-h-screen overflow-y-auto">
                            <h3 class="text-lg font-semibold mb-4 text-purple-400">📊 Results</h3>
                            <div id="analysis-panel" class="text-sm text-slate-400 space-y-2">
                                <div class="p-3 bg-slate-800 rounded text-center text-slate-500">
                                    <i class="fas fa-arrow-up"></i> Click a button to analyze
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'border-cyan-400', 'text-cyan-400');
                btn.classList.add('text-slate-400');
            });
            
            document.getElementById(tabName + '-tab').classList.remove('hidden');
            event.target.closest('.tab-btn').classList.add('active', 'border-cyan-400', 'text-cyan-400');
            event.target.closest('.tab-btn').classList.remove('text-slate-400');
        }

        function analyzeCode() {
            const code = document.getElementById('analyzer-code').value;
            const language = document.getElementById('analyzer-language').value;
            
            if (!code.trim()) {
                showAnalysisError('Please enter code to analyze');
                return;
            }

            const analysisPanel = document.getElementById('analysis-panel');
            analysisPanel.innerHTML = '<div class="text-center py-4"><div class="text-blue-400 animate-pulse">🔍 Analyzing...</div></div>';

            fetch('./api/analyze-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, language })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    displayAnalysisResults(data.analysis);
                } else {
                    showAnalysisError(data.error);
                }
            })
            .catch(() => showAnalysisError('Connection error'));
        }

        function detectBugs() {
            const code = document.getElementById('analyzer-code').value;
            const language = document.getElementById('analyzer-language').value;
            
            if (!code.trim()) {
                showAnalysisError('Please enter code');
                return;
            }

            fetch('./api/detect-bugs', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, language })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    const panel = document.getElementById('analysis-panel');
                    panel.innerHTML = `<div class="text-lg font-semibold text-red-400 mb-2">🐛 Found ${data.bugs.total_bugs}</div>`;
                    
                    data.bugs.issues.forEach(bug => {
                        const color = bug.severity === 'CRITICAL' ? 'red-500' : bug.severity === 'HIGH' ? 'red-400' : bug.severity === 'MEDIUM' ? 'yellow-400' : 'blue-400';
                        panel.innerHTML += `<div class="bg-slate-900 p-2 rounded mb-2 border-l-4 border-red-500">
                            <div class="text-${color} font-bold text-xs">${bug.severity}</div>
                            <div class="text-slate-400 text-xs mt-1">${bug.type}</div>
                        </div>`;
                    });
                }
            })
            .catch(() => showAnalysisError('Bug detection failed'));
        }

        function analyzePerformance() {
            const code = document.getElementById('analyzer-code').value;
            const language = document.getElementById('analyzer-language').value;
            
            if (!code.trim()) {
                showAnalysisError('Please enter code');
                return;
            }

            fetch('./api/performance-analysis', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, language })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    const m = data.metrics;
                    const panel = document.getElementById('analysis-panel');
                    panel.innerHTML = `
                        <div class="font-semibold text-blue-400 mb-3">📊 Metrics</div>
                        <div class="bg-slate-900 p-2 rounded mb-2">
                            <div class="text-slate-400 text-xs">Complexity</div>
                            <div class="text-lg font-bold text-cyan-400">${m.cyclomatic_complexity}</div>
                        </div>
                        <div class="bg-slate-900 p-2 rounded mb-2">
                            <div class="text-slate-400 text-xs">Max Depth</div>
                            <div class="text-lg font-bold text-cyan-400">${m.nested_depth}</div>
                        </div>
                        <div class="bg-slate-900 p-2 rounded mb-2">
                            <div class="text-slate-400 text-xs">Perf Score</div>
                            <div class="text-lg font-bold text-green-400">${m.performance_score}/100</div>
                        </div>
                        <div class="bg-slate-900 p-2 rounded">
                            <div class="text-slate-400 text-xs">Rating</div>
                            <div class="text-sm font-bold">${m.performance_rating}</div>
                        </div>
                    `;
                }
            })
            .catch(() => showAnalysisError('Performance analysis failed'));
        }

        function getRefactoringTips() {
            const code = document.getElementById('analyzer-code').value;
            const language = document.getElementById('analyzer-language').value;
            
            if (!code.trim()) {
                showAnalysisError('Please enter code');
                return;
            }

            fetch('./api/refactoring-suggestions', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, language })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    const panel = document.getElementById('analysis-panel');
                    panel.innerHTML = `<div class="font-semibold text-green-400 mb-2">💡 Tips (${data.suggestions.length})</div>`;
                    
                    data.suggestions.forEach(sug => {
                        panel.innerHTML += `
                            <div class="bg-slate-900 p-2 rounded mb-2 border-l-4 border-green-500">
                                <div class="font-semibold text-xs text-${sug.priority === 'HIGH' ? 'red-400' : 'yellow-400'}">${sug.type}</div>
                                <div class="text-slate-400 text-xs mt-1">${sug.suggestion}</div>
                            </div>
                        `;
                    });
                }
            })
            .catch(() => showAnalysisError('Refactoring tips failed'));
        }

        function displayAnalysisResults(analysis) {
            const panel = document.getElementById('analysis-panel');
            const scoreColor = analysis.overall_score >= 80 ? 'text-green-400' : 
                               analysis.overall_score >= 60 ? 'text-yellow-400' : 'text-red-400';
            
            let html = `
                <div class="bg-slate-800 border border-slate-700 rounded-lg p-3 mb-3 text-center">
                    <div class="text-3xl font-bold ${scoreColor}">${analysis.overall_score}</div>
                    <div class="text-xs text-slate-400">Quality Score</div>
                </div>
            `;

            html += `<div class="bg-slate-900 p-2 rounded mb-2"><div class="text-red-400 text-sm font-bold">🐛 Bugs: ${analysis.bugs.total_bugs}</div></div>`;
            html += `<div class="bg-slate-900 p-2 rounded mb-2"><div class="text-blue-400 text-sm font-bold">📊 Score: ${analysis.performance.performance_score}</div></div>`;
            html += `<div class="bg-slate-900 p-2 rounded"><div class="text-green-400 text-sm font-bold">💡 Tips: ${analysis.refactoring_suggestions.length}</div></div>`;

            panel.innerHTML = html;
        }

        function showAnalysisError(message) {
            const panel = document.getElementById('analysis-panel');
            panel.innerHTML = `<div class="text-red-400 p-2 bg-slate-900 rounded text-xs">❌ ${message}</div>`;
        }

        function runCode() {
            const lang = document.getElementById('code-language').value;
            const code = document.getElementById('code-editor').value;
            const outputConsole = document.getElementById('output');

            outputConsole.innerText = "Executing...";

            fetch('./api/execute', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ language: lang, code: code })
            })
            .then(r => r.json())
            .then(data => {
                outputConsole.innerText = data.output || data.error || 'No output';
            })
            .catch(() => {
                outputConsole.innerText = "Error connecting to server";
            });
        }

        async function askAI() {
            const input = document.getElementById('ai-input').value;
            const chatBox = document.getElementById('ai-chat-box');
            if (!input) return;

            chatBox.innerHTML += `<div class="text-cyan-400 font-bold mt-3">You: ${input}</div>`;
            document.getElementById('ai-input').value = '';

            if (input.toLowerCase().startsWith('/image ')) {
                const imagePrompt = input.substring(7);
                chatBox.innerHTML += `<div class="text-amber-400 italic mt-2">🎨 Generating image...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
                try {
                    const response = await fetch('./api/generate-image', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ prompt: imagePrompt })
                    });
                    const data = await response.json();
                    if (data.image_data) {
                        chatBox.innerHTML += `<div class="mt-3"><img src="${data.image_data}" class="rounded-xl max-w-sm"/></div>`;
                    } else {
                        chatBox.innerHTML += `<div class="text-red-400 mt-1">Error: ${data.error}</div>`;
                    }
                } catch (err) {
                    chatBox.innerHTML += `<div class="text-red-400 mt-1">Network error</div>`;
                }
            } else {
                try {
                    const response = await fetch('./api/ai', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ prompt: input })
                    });
                    const data = await response.json();
                    chatBox.innerHTML += `<div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800/60 max-w-[85%] mt-2 text-slate-200">AI: ${data.result}</div>`;
                } catch (err) {
                    chatBox.innerHTML += `<div class="text-red-400 mt-1">Error processing request</div>`;
                }
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleCredentialResponse(response) {
            const base64Url = response.credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
            const user = JSON.parse(jsonPayload);
            
            document.getElementById('google-btn').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            document.getElementById('user-name').innerText = user.name;
            document.getElementById('user-avatar').src = user.picture;
        }

        function logout() {
            document.getElementById('google-btn').classList.remove('hidden');
            document.getElementById('user-profile').classList.add('hidden');
            location.reload();
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "718038529129-dummyclientid12345.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("google-btn"),
                { theme: "dark", size: "medium", type: "standard", shape: "pill" }
            );
        };
    </script>
</body>
</html>
